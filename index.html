<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مقياس — مهامي الذكية</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="تطبيق مهام يقسّم أهدافك اليومية والأسبوعية والشهرية والسنوية على وحدات أصغر تلقائيًا">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F1F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1622" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مقياس">
<script>
  document.documentElement.setAttribute("dir", "rtl");
  document.documentElement.setAttribute("lang", "ar");
</script>

<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  /* light */
  --bg:#F1F5F7;
  --bg-grad:radial-gradient(1100px 560px at 100% -12%, #DCEEEB 0%, transparent 62%);
  --surface:#FFFFFF;
  --surface-2:#EFF4F7;
  --surface-3:#E3EBF0;
  --line:#DBE4EA;
  --line-2:#C2D2DC;
  --text:#0C1A24;
  --text-2:#445A69;
  --text-3:#7B92A2;
  --accent:#0E9384;
  --accent-2:#0B7A6E;
  --accent-soft:#D5F2ED;
  --on-accent:#FFFFFF;
  --brass:#B45309;
  --brass-soft:#FCEBD5;
  --ok:#0F8A5F;
  --ok-soft:#D6F2E5;
  --bad:#C3413B;
  --bad-soft:#FAE3E2;
  --shadow-1:0 1px 2px rgba(12,26,36,.05), 0 1px 1px rgba(12,26,36,.04);
  --shadow-2:0 18px 40px -20px rgba(12,26,36,.26), 0 2px 8px rgba(12,26,36,.06);
  --shadow-pop:0 24px 60px -18px rgba(12,26,36,.35);

  --c-teal:#0E9384; --c-ocean:#2563EB; --c-plum:#9333EA;
  --c-brass:#B45309; --c-olive:#4D7C0F; --c-clay:#E11D48;

  --font-display:"SF Arabic Rounded","Noto Kufi Arabic","Dubai","Cairo","SF Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-body:"SF Arabic","Noto Sans Arabic","IBM Plex Sans Arabic","Dubai","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-num:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Consolas,monospace;

  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:24px;
  --col:760px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1622;
    --bg-grad:radial-gradient(1100px 560px at 100% -12%, #102B33 0%, transparent 62%);
    --surface:#132433;
    --surface-2:#182E3F;
    --surface-3:#1F3A4D;
    --line:#263F53;
    --line-2:#35576F;
    --text:#E9F2F7;
    --text-2:#9FB6C7;
    --text-3:#6D8799;
    --accent:#2DD4BF;
    --accent-2:#5EEAD4;
    --accent-soft:#0E3330;
    --on-accent:#04211E;
    --brass:#FBBF24;
    --brass-soft:#33290F;
    --ok:#34D399;
    --ok-soft:#0D3025;
    --bad:#F87171;
    --bad-soft:#37191B;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 18px 40px -20px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.35);
    --shadow-pop:0 24px 60px -18px rgba(0,0,0,.85);
    --c-teal:#2DD4BF; --c-ocean:#60A5FA; --c-plum:#C084FC;
    --c-brass:#FBBF24; --c-olive:#A3E635; --c-clay:#FB7185;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1622;
  --bg-grad:radial-gradient(1100px 560px at 100% -12%, #102B33 0%, transparent 62%);
  --surface:#132433;
  --surface-2:#182E3F;
  --surface-3:#1F3A4D;
  --line:#263F53;
  --line-2:#35576F;
  --text:#E9F2F7;
  --text-2:#9FB6C7;
  --text-3:#6D8799;
  --accent:#2DD4BF;
  --accent-2:#5EEAD4;
  --accent-soft:#0E3330;
  --on-accent:#04211E;
  --brass:#FBBF24;
  --brass-soft:#33290F;
  --ok:#34D399;
  --ok-soft:#0D3025;
  --bad:#F87171;
  --bad-soft:#37191B;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 18px 40px -20px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.35);
  --shadow-pop:0 24px 60px -18px rgba(0,0,0,.85);
  --c-teal:#2DD4BF; --c-ocean:#60A5FA; --c-plum:#C084FC;
  --c-brass:#FBBF24; --c-olive:#A3E635; --c-clay:#FB7185;
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  direction:rtl;
  background:var(--bg);
  background-image:var(--bg-grad);
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:800;margin:0;line-height:1.25;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
::selection{background:var(--accent);color:var(--on-accent)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* ============================================================
   SHELL
   ============================================================ */
.app{min-height:100dvh;display:flex;flex-direction:column}

/* شريط التطبيق العلوي — ثابت، ويحترم منطقة الأمان */
.appbar{
  position:sticky;top:0;z-index:30;
  background:var(--surface);
  background:color-mix(in srgb,var(--surface) 90%,transparent);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.appbar-in{
  max-width:var(--col);margin-inline:auto;
  display:flex;align-items:center;gap:11px;
  padding:11px 18px;
  padding-inline-start:max(18px, env(safe-area-inset-left));
  padding-inline-end:max(18px, env(safe-area-inset-right));
}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:34px;height:34px;border-radius:11px;flex:none;
  background:linear-gradient(150deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;color:var(--on-accent);
  box-shadow:0 6px 16px -8px var(--accent);
}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:16px;letter-spacing:-.02em}

/* عمود المحتوى: يتوسّط على الآيباد والشاشات الكبيرة بدل أن يتمدد */
.main{
  flex:1;min-width:0;width:100%;
  max-width:var(--col);margin-inline:auto;
  padding:20px 18px calc(112px + env(safe-area-inset-bottom));
  padding-inline-start:max(18px, env(safe-area-inset-left));
  padding-inline-end:max(18px, env(safe-area-inset-right));
  display:flex;flex-direction:column;gap:20px;
}
.topbar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.topbar h1{font-size:clamp(24px,6vw,32px)}
.topbar .date{font-size:13px;color:var(--text-3);margin-top:4px}
.topbar-actions{margin-inline-start:auto;display:flex;gap:9px;align-items:center}

/* شريط التبويب السفلي — على كل المقاسات */
.tabbar{
  position:fixed;bottom:0;inset-inline:0;z-index:40;
  background:var(--surface);
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-in{
  max-width:var(--col);margin-inline:auto;
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px 10px;
}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:6px 0;min-height:52px;justify-content:center;
  color:var(--text-3);font-size:10.5px;font-weight:700;transition:color .18s;
}
.tab[aria-current="true"]{color:var(--accent)}
.tab .dot{
  position:absolute;margin-top:-34px;width:4px;height:4px;border-radius:50%;
  background:var(--accent);opacity:0;transition:opacity .2s;
}
.tab[aria-current="true"] .dot{opacity:1}

/* زر الإضافة العائم */
.fab{
  position:fixed;z-index:41;
  /* يحاذي حافة عمود المحتوى متى اتسعت الشاشة، وإلا حافة الشاشة */
  inset-inline-end:max(18px, calc((100vw - var(--col)) / 2 + 18px));
  bottom:calc(84px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--accent);color:var(--on-accent);
  box-shadow:0 14px 30px -8px var(--accent), var(--shadow-2);
  transition:transform .16s;
}
.fab:active{transform:scale(.93)}

.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 16px;border-radius:var(--r-md);
  font-weight:700;font-size:14px;
  border:1px solid transparent;
  transition:transform .12s, box-shadow .2s, background .2s;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 20px -10px var(--accent)}
.btn-primary:hover{background:var(--accent-2)}
.btn-quiet{background:var(--surface);border-color:var(--line);color:var(--text-2)}
.btn-quiet:hover{background:var(--surface-3);color:var(--text)}
.btn-danger{background:var(--bad);color:#fff}
.icon-btn{
  width:40px;height:40px;border-radius:var(--r-md);
  display:grid;place-items:center;border:1px solid var(--line);
  background:var(--surface);color:var(--text-2);
  transition:background .18s,color .18s;
}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}

.view{display:none;flex-direction:column;gap:20px;animation:rise .32s cubic-bezier(.2,.7,.2,1)}
.view.on{display:flex}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.section-head{display:flex;align-items:baseline;gap:10px;margin-bottom:-4px}
.section-head h2{font-size:16px}
.section-head .hint{font-size:12.5px;color:var(--text-3)}
.section-head .line{flex:1;height:1px;background:var(--line)}

/* رأس قسم قابل للطي بعدّاد — كما في المرجع */
.sec{
  display:flex;align-items:center;gap:11px;width:100%;text-align:start;
  padding:14px 18px;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow-1);transition:border-color .18s,background .18s;
}
.sec:hover{border-color:var(--line-2)}
.sec .ic{display:flex;color:var(--accent)}
.sec h2{flex:1;font-size:15.5px}
.sec .cnt{
  font-family:var(--font-num);font-size:13px;font-weight:700;color:var(--text-2);
  background:var(--surface-3);padding:3px 11px;border-radius:99px;
}
.sec .cnt.full{background:var(--accent-soft);color:var(--accent)}
.sec .chev{color:var(--text-3);display:flex;transition:transform .25s}
.sec[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.secwrap{display:flex;flex-direction:column;gap:14px}

/* ============================================================
   CARD
   ============================================================ */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-xl);box-shadow:var(--shadow-1);
  overflow:hidden;
}
.stack{display:flex;flex-direction:column;gap:14px}

.tag{
  font-size:11px;font-weight:600;letter-spacing:.01em;
  padding:2.5px 9px;border-radius:99px;
  background:var(--surface-3);color:var(--text-2);
  border:1px solid transparent;white-space:nowrap;
}
.tag.accent{background:var(--accent-soft);color:var(--tc)}
.tag.accent{background:color-mix(in srgb,var(--tc) 13%,transparent)}
.tag.warn{background:var(--brass-soft);color:var(--brass)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}

/* progress bar */
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;position:relative}
.bar i{
  display:block;height:100%;border-radius:99px;background:var(--tc);
  transition:width .5s cubic-bezier(.2,.7,.2,1);
}
.bar .pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--brass);border-radius:2px;opacity:.85}
.bar.done i{background:var(--ok)}

/* ============================================================
   DISTRIBUTION METER  — the signature element
   ============================================================ */
.dist{
  display:grid;gap:5px;align-items:end;
  grid-auto-rows:auto;
}
.dist .cell{
  grid-row:1;position:relative;height:56px;border-radius:var(--r-sm);
  background:var(--surface-3);border:1px solid var(--line);
  overflow:hidden;transition:border-color .2s, background .2s, transform .12s;
  display:block;width:100%;
}
button.cell{cursor:pointer}
button.cell:hover{border-color:var(--tc);transform:translateY(-2px)}
.cell .fill{
  position:absolute;inset-inline:0;bottom:0;height:var(--p,0%);
  background:var(--tc);
  background:color-mix(in srgb,var(--tc) 80%,transparent);
  transition:height .5s cubic-bezier(.2,.7,.2,1);
}
.cell .n{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--font-num);font-size:13px;font-weight:700;
  color:var(--text);letter-spacing:-.03em;
}
.cell.full .n{color:var(--on-accent)}
.cell.rest{background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 5px,var(--surface-3) 5px,var(--surface-3) 10px);border-style:dashed}
.cell.rest .n{color:var(--text-3);font-size:11px}
.cell.pre{opacity:.42}
.cell.miss{border-color:var(--bad);background:var(--bad-soft)}
.cell.miss{border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.cell.miss .n{color:var(--bad)}
.cell.past.ok{border-color:var(--ok)}
.cell.past.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.cell.now{box-shadow:inset 0 0 0 2px var(--brass);border-color:var(--brass)}
.dist .lab{
  grid-row:2;text-align:center;font-size:10.5px;color:var(--text-3);
  line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dist .lab.now{color:var(--brass);font-weight:800}
.dist-scroll{overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}

/* grouped breakdown (month -> weeks -> days) */
.grp{display:flex;flex-direction:column;gap:12px}
.grp-row{
  display:grid;grid-template-columns:152px 1fr;gap:14px;align-items:center;
  padding:11px;border-radius:var(--r-md);background:var(--surface-2);
  border:1px solid var(--line);
}
.grp-row.now{border-color:var(--brass);background:var(--brass-soft)}
.grp-row.now{border-color:color-mix(in srgb,var(--brass) 50%,transparent)}
.grp-name{font-size:12.5px;font-weight:700;color:var(--text-2)}
.grp-sub{font-size:11px;color:var(--text-3);font-family:var(--font-num)}

.step{
  display:inline-flex;align-items:center;border:1px solid var(--line);
  border-radius:var(--r-md);overflow:hidden;background:var(--surface);
}
.step button{
  width:44px;height:44px;display:grid;place-items:center;
  color:var(--text-2);font-size:17px;font-weight:700;transition:background .15s,color .15s;
}
.step button:hover{background:var(--surface-3);color:var(--tc)}
.step .val{
  min-width:56px;line-height:44px;text-align:center;font-family:var(--font-num);
  font-weight:700;font-size:14px;border-inline:1px solid var(--line);
  padding:0 6px;
}
.link-btn{font-size:12.5px;font-weight:600;color:var(--text-3);padding:6px 8px;border-radius:8px}
.link-btn:hover{color:var(--text);background:var(--surface-3)}
.link-btn.danger:hover{color:var(--bad);background:var(--bad-soft)}
.spacer{margin-inline-start:auto}

/* ============================================================
   TODAY VIEW
   ============================================================ */
.check{
  width:34px;height:34px;border-radius:10px;border:2px solid var(--line-2);
  display:grid;place-items:center;color:transparent;flex:none;
  transition:background .2s,border-color .2s,color .2s,transform .15s;
}
.check:hover{border-color:var(--tc);transform:scale(1.06)}
/* nothing scheduled today is not the same as finished */
/* ---- add bar: سطر واحد، لا بطاقة ولا أمثلة معروضة ---- */
.addbar{position:relative}
.addbar svg{
  position:absolute;inset-inline-start:15px;top:15px;
  color:var(--text-3);pointer-events:none;
}
.addbar input{
  width:100%;padding:14px 18px;padding-inline-start:44px;
  border-radius:var(--r-lg);border:1px solid var(--line);
  background:var(--surface);font-size:14.5px;box-shadow:var(--shadow-1);
  transition:border-color .18s, box-shadow .18s;
}
.addbar input:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft), var(--shadow-1);
}
.addbar input::placeholder{color:var(--text-3)}
.addhint{font-size:11.5px;color:var(--text-3);margin-top:9px;padding-inline-start:4px}

/* نبض اليوم: حلقة تقدم + سطرا ملخّص */
.pulse{
  display:flex;align-items:center;gap:16px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-xl);padding:16px 18px;box-shadow:var(--shadow-1);
}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
/* flex + baseline: مع grid يصير النص و<small> عنصرين في صفّين */
.ring-n{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1px;
  font-family:var(--font-num);font-size:17px;font-weight:700;letter-spacing:-.04em;
}
.ring-n small{font-size:10px;color:var(--text-3);font-weight:600}
.pulse-txt{min-width:0}
.pulse-txt b{display:block;font-family:var(--font-display);font-size:16px;font-weight:800}
.pulse-txt span{display:block;font-size:12.5px;color:var(--text-3);margin-top:5px;line-height:1.6}
.pulse-txt i{font-style:normal;color:var(--text-2);font-weight:700}

/* what the parser understood */
.read{
  border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface-2);padding:14px 15px;
}
.read-t{
  font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--brass);
  display:flex;align-items:center;gap:7px;margin-bottom:10px;
}
.read-grid{display:flex;flex-wrap:wrap;gap:7px}
.rchip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;
  background:var(--surface);border:1px solid var(--line);color:var(--text-2);
}
.rchip b{color:var(--text);font-family:var(--font-num);font-weight:700}
.rchip.guess{border-style:dashed;color:var(--text-3)}
.rchip.guess::after{content:"تخمين";font-size:9.5px;opacity:.7;font-weight:700}

/* smart advice inside the form */
.advice{
  display:flex;align-items:flex-start;gap:10px;margin-top:11px;
  padding:10px 12px;border-radius:var(--r-md);
  background:var(--brass-soft);border:1px solid color-mix(in srgb,var(--brass) 35%,transparent);
  font-size:12.5px;color:var(--text-2);line-height:1.6;
}
.advice button{
  font-size:12px;font-weight:800;color:var(--brass);white-space:nowrap;
  text-decoration:underline;text-underline-offset:3px;
}

/* ============================================================
   CARD GRID
   ============================================================ */
/* align-items:start يمنع البطاقة المطوية من التمدد لتساوي جارتها المفتوحة */
/* min(...,100%) وإلا فرَض الحد الأدنى عرضًا أكبر من الشاشة على الجوال */
.grid{display:grid;gap:15px;align-items:start;
  grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(460px,100%),1fr))}

.tcard{
  --tc:var(--c-teal);
  position:relative;display:flex;flex-direction:column;min-width:0;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow-1);
  transition:border-color .2s, box-shadow .25s;
}
/* الحدّ العلوي الملوّن: هوية المهمة بلمحة */
.tcard::before{
  content:"";position:absolute;top:0;inset-inline:0;height:3px;background:var(--tc);
}
.tcard.done::before{background:var(--ok)}
.tcard:hover{box-shadow:var(--shadow-2);border-color:var(--line-2)}
.tcard.idle{opacity:.55}

.tc-top{display:flex;align-items:flex-start;gap:13px;padding:20px 20px 0}
.tc-id{flex:1;min-width:0}
.tc-title{
  font-family:var(--font-display);font-weight:800;font-size:16px;
  line-height:1.4;letter-spacing:-.015em;
}
.tcard.done .tc-title{color:var(--text-3)}
.tc-sub{font-size:12px;color:var(--text-3);margin-top:5px;line-height:1.6}
.tc-sub b{color:var(--text-2);font-family:var(--font-num);font-weight:700}

/* الرقم الأساسي والمُدخل في سطر واحد */
.tc-act{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:14px;padding:18px 20px 20px;
}
.tc-big{display:flex;align-items:baseline;gap:8px;min-width:0}
.tc-big b{
  font-family:var(--font-num);font-size:38px;font-weight:700;
  letter-spacing:-.05em;color:var(--tc);line-height:.9;
}
.tc-big.ok b{color:var(--ok)}
.tc-big i{font-style:normal;font-size:12px;color:var(--text-3);line-height:1.35}

.tc-meter{padding:0 20px 20px}
.tc-links{display:flex;gap:2px;align-items:center;flex:none}
.ibtn{
  width:36px;height:36px;border-radius:9px;display:grid;place-items:center;
  color:var(--text-3);transition:background .16s,color .16s;
}
.ibtn:hover{background:var(--surface-3);color:var(--text)}
.ibtn.danger:hover{background:var(--bad-soft);color:var(--bad)}

/* شريط التقدم على حافة البطاقة السفلى: خط واحد يحمل اللون والحالة معًا */
.tc-prog{margin-top:auto;height:4px;background:var(--surface-3)}
.tc-prog i{display:block;height:100%;background:var(--tc);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.tcard.done .tc-prog i{background:var(--ok)}

.disclose{
  width:100%;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:11px;font-size:12px;font-weight:700;color:var(--text-3);
  border-top:1px solid var(--line);transition:color .18s,background .18s;
}
.disclose:hover{color:var(--accent);background:var(--surface-2)}
.disclose svg{transition:transform .25s}
.disclose[aria-expanded="true"] svg{transform:rotate(180deg)}
.tc-detail{padding:16px 20px 6px;border-top:1px solid var(--line);background:var(--surface-2)}

/* ============================================================
   REFLECTION — تأمل مبني على أرقام اليوم
   ============================================================ */
.refl{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-xl);box-shadow:var(--shadow-1);overflow:hidden;
}
.refl-head{
  display:flex;align-items:center;gap:13px;padding:16px 20px;width:100%;
  text-align:start;transition:background .18s;
}
button.refl-head:hover{background:var(--surface-2)}
.refl-head h3{font-size:15px;flex:1}
.refl-head .sub{font-size:11.5px;color:var(--text-3);font-weight:500;display:block;margin-top:3px}
.refl-head .chev{transition:transform .25s;color:var(--text-3)}
.refl-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.refl-body{padding:4px 20px 20px;display:flex;flex-direction:column;gap:18px;
  border-top:1px solid var(--line);padding-top:18px}

/* the day's facts, so reflection isn't guesswork */
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.fact{background:var(--surface-2);padding:11px 13px}
.fact .k{font-size:10.5px;color:var(--text-3);letter-spacing:.02em}
.fact .v{font-family:var(--font-num);font-size:19px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.fact .v small{font-size:11px;color:var(--text-3);font-weight:600}

.energy{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.energy button{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:12px 4px 10px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface-2);
  font-size:10.5px;font-weight:700;color:var(--text-3);
  transition:all .17s;
}
.energy button:hover{border-color:var(--line-2);color:var(--text-2)}
.energy button[aria-pressed="true"]{
  background:var(--accent-soft);border-color:var(--accent);color:var(--accent);
}
.lvl{display:flex;align-items:flex-end;gap:2.5px;height:18px}
.lvl i{width:4px;border-radius:2px;background:var(--line-2);display:block}
.energy button[aria-pressed="true"] .lvl i.on{background:var(--accent)}
.lvl i.on{background:var(--text-3)}

.refl-note{
  width:100%;padding:11px 13px;border-radius:var(--r-md);resize:vertical;min-height:44px;
  border:1px solid var(--line);background:var(--surface-2);font-family:inherit;line-height:1.6;
}
.refl-note:focus{outline:none;border-color:var(--accent);background:var(--surface)}

.saved-line{
  display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ok);
  background:var(--ok-soft);padding:9px 13px;border-radius:var(--r-md);
}

/* ============================================================
   INSIGHTS
   ============================================================ */
.ins{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.ins-card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:17px 18px;box-shadow:var(--shadow-1);
  display:flex;flex-direction:column;gap:12px;
}
.ins-k{
  font-size:10.5px;font-weight:800;letter-spacing:.07em;color:var(--text-3);
}
.ins-v{font-size:14.5px;line-height:1.65;color:var(--text-2)}
.ins-v b{color:var(--text);font-weight:800}
.ins-v .num{color:var(--accent);font-weight:700}

.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;align-items:end}
.wk .c{grid-row:1;height:56px;border-radius:8px;background:var(--surface-3);position:relative;overflow:hidden}
.wk .c i{position:absolute;inset-inline:0;bottom:0;height:var(--p);background:var(--accent);opacity:.85}
.wk .c.best i{background:var(--ok)}
.wk .c.worst i{background:var(--bad)}
.wk .l{grid-row:2;text-align:center;font-size:10px;color:var(--text-3)}
.wk .l.best{color:var(--ok);font-weight:800}
.wk .l.worst{color:var(--bad);font-weight:800}

.blk{display:flex;flex-direction:column;gap:8px}
.blk-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:13px}
.blk-bar{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:5px}
.blk-bar i{display:block;height:100%;background:var(--brass);border-radius:99px}
.blk-n{font-family:var(--font-num);font-weight:700;color:var(--text-2);font-size:12.5px}

/* ============================================================
   LOAD BOARD — كل المهام على محور أيام واحد
   ============================================================ */
.board{
  display:grid;grid-template-columns:74px repeat(7,minmax(0,1fr));
  gap:4px;align-items:stretch;
}
.bh{
  text-align:center;font-size:10px;color:var(--text-3);line-height:1.35;
  padding-bottom:2px;
}
.bh.now{color:var(--brass);font-weight:800}
.bh b{display:block;font-family:var(--font-num);font-size:12px;color:var(--text-2);font-weight:700}
.bh.now b{color:var(--brass)}
.bname{
  display:flex;align-items:center;gap:6px;min-width:0;
  font-size:11.5px;font-weight:700;padding-inline-end:2px;
}
.bname i{width:7px;height:7px;border-radius:50%;background:var(--tc);flex:none}
.bname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcell{
  position:relative;height:40px;border-radius:9px;overflow:hidden;
  background:var(--surface-2);border:1px solid var(--line);
  display:block;width:100%;transition:border-color .16s,transform .12s;
}
button.bcell:hover{border-color:var(--tc);transform:translateY(-1px)}
.bcell .f{
  position:absolute;inset-inline:0;bottom:0;height:var(--p,0%);
  background:var(--tc);
  background:color-mix(in srgb,var(--tc) 78%,transparent);
}
.bcell .n{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--font-num);font-size:11.5px;font-weight:700;letter-spacing:-.03em;
}
.bcell.off{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 4px,var(--surface-2) 4px,var(--surface-2) 8px);border-style:dashed}
.bcell.off .n{color:var(--text-3);font-size:10px}
.bcell.miss{border-color:var(--bad);background:var(--bad-soft)}
.bcell.miss .n{color:var(--bad)}
.bcell.done .n{color:var(--on-accent)}
.bcell.now{box-shadow:inset 0 0 0 2px var(--brass)}
.bcell.est{border-style:dashed;opacity:.8}

.btot .bcell{background:var(--surface-3);border-color:transparent;height:34px}
.btot .bcell .f{background:var(--text-3);opacity:.35}
.btot .bcell.hot .f{background:var(--bad);opacity:.5}
.btot .bcell .n{font-size:11.5px;color:var(--text-2)}
.btot .bname{color:var(--text-3);font-size:11.5px;font-weight:700}

.board-scroll{overflow-x:auto}
.board-scroll .board{min-width:296px}
.wknav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.wknav h3{font-size:14.5px;flex:1;color:var(--text-2);font-weight:700}
.pillbtn{
  padding:7px 14px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface-2);font-size:12.5px;font-weight:700;color:var(--text-2);
  transition:all .16s;
}
.pillbtn:hover{border-color:var(--accent);color:var(--accent)}
.pillbtn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.empty{
  text-align:center;padding:56px 24px;color:var(--text-3);
  border:1px dashed var(--line-2);border-radius:var(--r-xl);background:var(--surface-2);
}
.empty h3{font-size:16px;color:var(--text-2);margin-bottom:6px}
.empty p{font-size:13px;max-width:38ch;margin:0 auto}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:15px 16px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow-1);
}
.kpi .k{font-size:11.5px;color:var(--text-3);letter-spacing:.02em}
.kpi .v{font-family:var(--font-num);font-size:26px;font-weight:700;letter-spacing:-.04em;line-height:1.1}
.kpi .v small{font-size:13px;color:var(--text-3);font-weight:600;margin-inline-start:3px}
.kpi.accent .v{color:var(--accent)}
.kpi.brass .v{color:var(--brass)}
.kpi.ok .v{color:var(--ok)}

/* ============================================================
   CALENDAR
   ============================================================ */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cal-head h3{font-size:17px;min-width:140px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{
  text-align:center;font-size:11px;color:var(--text-3);font-weight:700;
  padding-bottom:4px;letter-spacing:.02em;
}
.day{
  aspect-ratio:1;max-height:96px;min-height:62px;
  border-radius:var(--r-md);border:1px solid var(--line);
  background:var(--surface);padding:6px;display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;gap:3px;
  transition:border-color .18s,transform .12s,background .18s;position:relative;
}
.day:hover{border-color:var(--accent);transform:translateY(-2px)}
.day.out{opacity:.35}
.day.today{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.day.sel{background:var(--accent-soft);border-color:var(--accent)}
.day .dn{font-family:var(--font-num);font-size:12.5px;font-weight:700;color:var(--text-2)}
.day.today .dn{color:var(--brass)}
.load{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:6px}
.load i{width:5px;height:5px;border-radius:50%;background:var(--tc,var(--accent));opacity:.85}
.load i.done{background:var(--ok)}
.load i.miss{background:var(--bad)}
.day .amt{font-family:var(--font-num);font-size:10px;color:var(--text-3)}

/* ============================================================
   STATS
   ============================================================ */
.chart{display:flex;align-items:stretch;gap:3px;height:132px;padding-top:8px}
.chart .b{
  flex:1;height:100%;border-radius:4px 4px 2px 2px;background:var(--surface-3);
  position:relative;overflow:hidden;
}
.chart .b i{
  position:absolute;inset-inline:0;bottom:0;border-radius:4px 4px 2px 2px;
  background:var(--accent);height:var(--p);opacity:.9;
  transition:height .45s cubic-bezier(.2,.7,.2,1);
}
.chart .b.full i{background:var(--ok)}
.chart-x{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-3);margin-top:7px}
.legend-dots{display:flex;gap:14px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.legend-dots span{display:inline-flex;align-items:center;gap:6px}
.legend-dots i{width:9px;height:9px;border-radius:3px;display:block}

.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{
  text-align:start;font-size:11.5px;color:var(--text-3);font-weight:700;
  padding:0 12px 9px;letter-spacing:.02em;border-bottom:1px solid var(--line);
}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{font-weight:700}
.tbl-wrap{overflow-x:auto}

/* ============================================================
   MODAL / FORM
   ============================================================ */
.scrim{
  position:fixed;inset:0;background:rgba(6,20,18,.55);backdrop-filter:blur(6px);
  display:grid;place-items:center;padding:18px;z-index:60;
  animation:fade .2s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:min(620px,100%);max-height:min(88dvh,900px);overflow-y:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);
  box-shadow:var(--shadow-pop);animation:pop .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{
  display:flex;align-items:center;gap:12px;padding:18px 22px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2;
}
.modal-head h3{font-size:17px;flex:1}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.modal-foot{
  display:flex;gap:10px;padding:15px 22px;border-top:1px solid var(--line);
  background:var(--surface-2);position:sticky;bottom:0;
}

.field{display:flex;flex-direction:column;gap:7px}
.field > label{font-size:12.5px;font-weight:700;color:var(--text-2)}
.note{font-size:11.5px;color:var(--text-3);line-height:1.6}
.inp{
  width:100%;padding:11px 13px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface-2);
  transition:border-color .18s, background .18s;
}
.inp:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:8px 13px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface-2);font-size:13px;font-weight:600;color:var(--text-2);
  transition:all .16s;
}
.chip:hover{border-color:var(--line-2);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
/* شدّة اليوم: ثلاث حالات بدل تبديل ثنائي */
.chip.sq{
  width:44px;padding:7px 0 5px;text-align:center;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2;
}
.chip.sq em{font-style:normal;font-size:10px;font-weight:800;opacity:.85}
.chip.sq.lv0{opacity:.5;border-style:dashed}
.chip.sq.lv1{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.sq.lv2{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip:disabled{opacity:.35;cursor:not-allowed}

.swatches{display:flex;gap:8px}
.sw{width:30px;height:30px;border-radius:10px;border:2px solid transparent;background:var(--s);transition:transform .15s}
.sw:hover{transform:scale(1.1)}
.sw[aria-pressed="true"]{border-color:var(--text);transform:scale(1.12)}

.switch{display:flex;align-items:center;gap:11px;cursor:pointer;padding:2px 0}
.switch .track{
  width:44px;height:25px;border-radius:99px;background:var(--surface-3);
  border:1px solid var(--line);position:relative;transition:background .2s,border-color .2s;flex:none;
}
.switch .track::after{
  content:"";position:absolute;top:2px;inset-inline-start:2px;
  width:19px;height:19px;border-radius:50%;background:var(--surface);
  box-shadow:var(--shadow-1);transition:transform .22s cubic-bezier(.3,.8,.3,1);
}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch input:checked + .track{background:var(--accent);border-color:var(--accent)}
.switch input:checked + .track::after{transform:translateX(-19px)}
.switch .sw-txt b{display:block;font-size:13.5px;font-weight:700}
.switch .sw-txt span{font-size:11.5px;color:var(--text-3)}

.preview{
  border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface-2);padding:15px;--tc:var(--c-teal);
}
.preview-title{
  font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--brass);
  margin-bottom:11px;display:flex;align-items:center;gap:7px;
}
.preview-sum{font-size:13px;color:var(--text-2);margin-top:11px}
.preview-sum b{color:var(--text);font-family:var(--font-num);font-weight:700}

/* toast */
.toast-wrap{
  position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);
  z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
}
.toast{
  display:flex;align-items:center;gap:12px;
  background:var(--text);color:var(--bg);
  padding:11px 16px;border-radius:99px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow-pop);pointer-events:auto;
  animation:toastIn .3s cubic-bezier(.2,.8,.2,1);
}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.toast button{color:var(--accent-2);font-weight:800;font-size:13px}
:root[data-theme="dark"] .toast button,
:root:not([data-theme="light"]) .toast button{color:var(--accent)}

/* لمسات الشاشات الصغيرة */
@media (max-width:640px){
  .main{padding-top:16px;gap:18px}
  .topbar h1{font-size:26px}
  .section-head{flex-wrap:wrap}
  .section-head .hint{order:3;flex-basis:100%}
  .section-head .line{display:none}
  .grp-row{grid-template-columns:1fr;gap:9px}
  .row2,.row3{grid-template-columns:1fr}
  .magic-row{flex-direction:column}
}
@media (max-width:560px){
  .cell{height:48px}
}
</style>
</head>
<body>
<div class="app">
  <!-- ================= APP BAR ================= -->
  <header class="appbar">
    <div class="appbar-in">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M4 19V6M10 19V10M16 19V4M22 19H2"/>
          </svg>
        </div>
        <div class="brand-name">مقياس</div>
      </div>
      <span class="spacer"></span>
      <button class="icon-btn" id="btnTheme" title="تبديل المظهر" aria-label="تبديل المظهر"></button>
    </div>
  </header>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">يومك</h1>
        <div class="date" id="pageDate"></div>
      </div>
    </header>

    <section class="view on" id="v-today"></section>
    <section class="view" id="v-tasks"></section>
    <section class="view" id="v-cal"></section>

<script>
"use strict";

/* ============================================================
   1. STORAGE (safe — falls back to memory in sandboxes)
   ============================================================ */
const Store = (() => {
  let ok = true;
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); }
  catch (e) { ok = false; }
  const mem = {};
  return {
    get(k, d) {
      try { const v = ok ? localStorage.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); }
      catch (e) { return d; }
    },
    set(k, v) {
      const s = JSON.stringify(v);
      try { if (ok) localStorage.setItem(k, s); else mem[k] = s; } catch (e) { mem[k] = s; }
    }
  };
})();

/* ============================================================
   2. CONSTANTS
   ============================================================ */
const DAY_FULL  = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const DAY_SHORT = ["أحد","إثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
const MONTHS    = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

const PERIODS = {
  daily:     { label:"يومية",      short:"اليوم",       splits:["none"],                  order:1 },
  weekly:    { label:"أسبوعية",    short:"هذا الأسبوع", splits:["day","none"],            order:2 },
  monthly:   { label:"شهرية",      short:"هذا الشهر",   splits:["week","day","none"],     order:3 },
  quarterly: { label:"ربع سنوية",  short:"هذا الربع",   splits:["month","week","none"],   order:4 },
  half:      { label:"نصف سنوية",  short:"هذا النصف",   splits:["month","week","none"],   order:5 },
  yearly:    { label:"سنوية",      short:"هذه السنة",   splits:["month","week","none"],   order:6 }
};
const SPLITS = {
  none:  { label:"بدون تقسيم", unitLabel:"الفترة",  each:"في الفترة" },
  day:   { label:"على الأيام",  unitLabel:"يوم",    each:"لكل يوم" },
  week:  { label:"على الأسابيع",unitLabel:"أسبوع",  each:"لكل أسبوع" },
  month: { label:"على الأشهر",  unitLabel:"شهر",    each:"لكل شهر" }
};
const COLORS = [
  { id:"teal",  v:"var(--c-teal)"  },
  { id:"ocean", v:"var(--c-ocean)" },
  { id:"plum",  v:"var(--c-plum)"  },
  { id:"brass", v:"var(--c-brass)" },
  { id:"olive", v:"var(--c-olive)" },
  { id:"clay",  v:"var(--c-clay)"  }
];
const UNIT_SUGGEST = ["محاضرة","صفحة","تمرين","دقيقة","ساعة","درس","مرة","كيلومتر","آية"];

/* ============================================================
   3. STATE
   ============================================================ */
/* التصميم مؤلَّف داكنًا في الأصل، فهو الافتراضي — والتبديل متاح دائمًا */
const DEFAULTS = { weekStart: 0, theme: "dark" };
let S = {
  settings: Object.assign({}, DEFAULTS, Store.get("mq.settings", {})),
  tasks:    Store.get("mq.tasks", null),
  progress: Store.get("mq.progress", {}),
  reflect:  Store.get("mq.reflect", {})
};
let view = "today";
let expanded = new Set();
let collapsed = new Set();
let calRef = new Date();
let calSel = null;
let lastAction = null;

const save = () => {
  bust();
  Store.set("mq.settings", S.settings);
  Store.set("mq.tasks", S.tasks);
  Store.set("mq.progress", S.progress);
  Store.set("mq.reflect", S.reflect);
};
const uid = () => Math.random().toString(36).slice(2, 10);

/* ============================================================
   4. DATE HELPERS
   ============================================================ */
const pad = n => String(n).padStart(2, "0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); x.setHours(0,0,0,0); return x; };
const sameDay = (a, b) => key(a) === key(b);
const startOfWeek = d => {
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() - S.settings.weekStart + 7) % 7));
  return x;
};
const round2 = n => Math.round(n * 100) / 100;
/* isolate a numeric range so RTL bidi doesn't flip "2–8" into "8–2" */
const ltr = s => "⁦" + s + "⁩";
const fmt = n => {
  const r = round2(n);
  return (Number.isInteger(r) ? r : r.toFixed(1)).toLocaleString("en-US");
};

function periodRange(period, ref) {
  const d = new Date(ref); d.setHours(0, 0, 0, 0);
  const y = d.getFullYear(), m = d.getMonth();
  switch (period) {
    case "daily":     return { start: d, end: d };
    case "weekly":  { const s = startOfWeek(d); return { start: s, end: addDays(s, 6) }; }
    case "monthly":   return { start: new Date(y, m, 1),        end: new Date(y, m + 1, 0) };
    case "quarterly": { const q = Math.floor(m / 3); return { start: new Date(y, q * 3, 1), end: new Date(y, q * 3 + 3, 0) }; }
    case "half":      { const h = m < 6 ? 0 : 1;     return { start: new Date(y, h * 6, 1), end: new Date(y, h * 6 + 6, 0) }; }
    default:          return { start: new Date(y, 0, 1),        end: new Date(y, 11, 31) };
  }
}
const periodKey = (period, ref) => period + ":" + key(periodRange(period, ref).start);

function periodTitle(period, ref) {
  const r = periodRange(period, ref), y = r.start.getFullYear();
  switch (period) {
    case "daily":     return `${DAY_FULL[r.start.getDay()]} ${r.start.getDate()} ${MONTHS[r.start.getMonth()]}`;
    case "weekly":    return `${r.start.getDate()} ${MONTHS[r.start.getMonth()]} — ${r.end.getDate()} ${MONTHS[r.end.getMonth()]}`;
    case "monthly":   return `${MONTHS[r.start.getMonth()]} ${y}`;
    case "quarterly": return `الربع ${Math.floor(r.start.getMonth() / 3) + 1} · ${y}`;
    case "half":      return `النصف ${r.start.getMonth() < 6 ? "الأول" : "الثاني"} · ${y}`;
    default:          return `سنة ${y}`;
  }
}

/* ============================================================
   وزن الأيام
   لكل يوم من أيام الأسبوع شدّة: 0 راحة، 1 عادي، 2 مكثّف.
   هي أساس التوزيع كله — يوم المكثّف يأخذ ضعف نصيب اليوم العادي.
   ============================================================ */
const INTENSITY = [[0, "راحة"], [1, "عادي"], [2, "مكثّف"]];

/* المهام القديمة تحمل rest:[…] فقط؛ نشتق منها الأوزان دون تعديل بياناتها */
function dayws(task) {
  if (Array.isArray(task.dayw) && task.dayw.length === 7) return task.dayw;
  const rest = task.rest || [];
  return [0, 1, 2, 3, 4, 5, 6].map(d => (rest.includes(d) ? 0 : 1));
}

/* مجموع أوزان الأيام داخل [a,b] */
function weightSpan(a, b, dw) {
  let n = 0;
  for (let d = new Date(a); d <= b; d = addDays(d, 1)) n += dw[d.getDay()];
  return n;
}

/* منحنى التوزيع عبر الخانات: متساوٍ، أو تصاعدي، أو تنازلي */
const CURVES = {
  even: { label: "متساوٍ",   hint: "نفس النصيب في كل خانة" },
  down: { label: "ابدأ قويًا", hint: "حِمل أثقل في البداية ويخفّ" },
  up:   { label: "تدرّج",     hint: "يبدأ خفيفًا ويثقل تدريجيًا" }
};
function curveFactor(curve, i, n) {
  if (n < 2 || !curve || curve === "even") return 1;
  const t = i / (n - 1);                       // 0 → 1
  return curve === "down" ? 1.7 - 1.4 * t : 0.3 + 1.4 * t;
}

/* ============================================================
   5. THE ENGINE — slots, distribution, smart rebalance
   ============================================================ */

/* توزيع مجموع على خانات بأوزان، بمجموع مطابق تمامًا.
   تقريب تراكمي: نقرّب المجموع الجاري ثم نأخذ الفرق. ميزته أنه يوزّع
   المجاميع الصغيرة على كامل المدى (٥ وحدات على ربع سنة تتفرّق بدل أن
   تتكدّس في أول خمسة أيام)، ويحترم ترتيب المنحنى في الوقت نفسه. */
function distribute(total, weights, decimals) {
  const n = weights.length;
  if (!n) return [];
  let sum = weights.reduce((a, b) => a + b, 0);
  let W = weights;
  if (sum <= 0) { W = weights.map(() => 1); sum = n; }
  const f = Math.pow(10, decimals || 0);
  const out = []; let acc = 0, prev = 0;
  for (let i = 0; i < n; i++) {
    acc += W[i];
    const c = Math.round((total * acc / sum) * f) / f;
    out.push(round2(c - prev));
    prev = c;
  }
  return out;
}

/* التقسيم الموصى به لكل فترة — الوحدة الأصغر المعقولة */
function bestSplit(period) {
  const rec = { daily:"none", weekly:"day", monthly:"day",
                quarterly:"week", half:"month", yearly:"month" }[period] || "none";
  const allowed = PERIODS[period].splits;
  return allowed.includes(rec) ? rec : allowed[0];
}

/* ============================================================
   5b. FEHM — فهم الجملة العربية بدون إنترنت
   يحوّل «أبغى أخلص ١٠ محاضرات هالأسبوع ما عدا الجمعة»
   إلى مهمة كاملة: مقدار + وحدة + فترة + تقسيم + أيام راحة.
   ============================================================ */

const AR_NUM = "٠١٢٣٤٥٦٧٨٩", FA_NUM = "۰۱۲۳۴۵۶۷۸۹";

/* normalisation that remembers where every character came from,
   so matched fragments can be cut out of the ORIGINAL text later */
function normMap(src) {
  let norm = "";
  const map = [];
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if (/[ً-ْٰـ]/.test(ch)) continue;      // حركات وتطويل
    let o = ch;
    const ai = AR_NUM.indexOf(ch), fi = FA_NUM.indexOf(ch);
    if (ai >= 0) o = String(ai);
    else if (fi >= 0) o = String(fi);
    else if ("أإآٱ".includes(ch)) o = "ا";
    else if (ch === "ى") o = "ي";
    else if (ch === "ة") o = "ه";
    else if (ch === "ؤ") o = "و";
    else if (ch === "ئ") o = "ي";
    else o = ch.toLowerCase();
    norm += o;
    map.push(i);
  }
  return { norm, map };
}

const NUM_WORDS = {
  "نص":0.5,"نصف":0.5,
  "واحده":1,"واحد":1,"وحده":1,
  "اثنين":2,"اثنان":2,"ثنتين":2,"اتنين":2,
  "ثلاثه":3,"ثلاث":3,"تلاته":3,"تلات":3,
  "اربعه":4,"اربع":4,
  "خمسه":5,"خمس":5,
  "سته":6,"ست":6,
  "سبعه":7,"سبع":7,
  "ثمانيه":8,"ثمان":8,"تمانيه":8,"تمان":8,
  "تسعه":9,"تسع":9,
  "عشره":10,"عشر":10,
  "عشرين":20,"ثلاثين":30,"اربعين":40,"خمسين":50,
  "ستين":60,"سبعين":70,"ثمانين":80,"تسعين":90,
  "مايه":100,"مئه":100,"ميه":100,"مايتين":200,"مئتين":200,"الف":1000
};

/* ترتيب الفحص مهم: «ربع سنه» تحتوي «سنه»، و«ثلاثه اشهر» تحتوي «شهر» */
const PERIOD_PAT = [
  ["half",      /(نصف? ?سنه|نص ?السنه|نصف سنوي|كل سته اشهر|كل 6 اشهر)/],
  ["quarterly", /(ربع ?سنه|ربع سنوي|كل ثلاثه اشهر|كل 3 اشهر|هالربع|هذا الربع|كل ربع)/],
  ["yearly",    /(كل سنه|سنويا|سنوي|بالسنه|في السنه|هالسنه|هذي السنه|هذه السنه|السنه)/],
  ["monthly",   /(كل شهر|شهريا|شهري|بالشهر|في الشهر|هالشهر|هذا الشهر|الشهر)/],
  ["weekly",    /(كل اسبوع|اسبوعيا|اسبوعي|بالاسبوع|في الاسبوع|هالاسبوع|هذا الاسبوع|الاسبوع)/],
  ["daily",     /(كل يوم|يوميا|يومي|باليوم|في اليوم|هاليوم|اليوم)/]
];
const SPLIT_PAT = [
  ["day",   /(علي ?الايام|عالايام|علي ايام|يوم بيوم)/],
  ["week",  /(علي ?الاسابيع|عالاسابيع|علي اسابيع)/],
  ["month", /(علي ?الاشهر|علي ?الشهور|عالاشهر)/]
];
/* حدود الكلمة إجبارية: \b في جافاسكربت لا تعمل مع العربية،
   وبدونها تُطابَق «الا» داخل «بالاسبوع» فينهار التحليل كله. */
const W0 = "(?:^|\\s)و?", W1 = "(?=\\s|$)";
const dayRe = alts => new RegExp(W0 + "(?:" + alts + ")" + W1);
const DAY_PAT = [
  [0, dayRe("الاحد|احد")],        [1, dayRe("الاثنين|الاتنين|اثنين")],
  [2, dayRe("الثلاثاء|الثلاثا")], [3, dayRe("الاربعاء|الاربعا")],
  [4, dayRe("الخميس|خميس")],      [5, dayRe("الجمعه|جمعه")],
  [6, dayRe("السبت|سبت")]
];
const EXCLUDE_PAT = new RegExp("(^|\\s)(ما ?عدا|ماعدا|عدا|الا|بدون|من غير|باستثناء)" + W1);
const WEEKEND_PAT = /(نهايه الاسبوع|الويكند|ويكند|الاجازه|الاجازات)/;

/* جمع → مفرد للوحدات الشائعة */
const UNIT_FIX = {
  "محاضرات":"محاضرة","محاضره":"محاضرة","صفحات":"صفحة","صفحه":"صفحة",
  "اجزاء":"جزء","تمارين":"تمرين","دروس":"درس","حصص":"حصة","حصه":"حصة",
  "ساعات":"ساعة","ساعه":"ساعة","دقائق":"دقيقة","دقايق":"دقيقة","دقيقه":"دقيقة",
  "مرات":"مرة","مره":"مرة","ايات":"آية","ايه":"آية","احاديث":"حديث",
  "اسئله":"سؤال","اسئلة":"سؤال","فيديوهات":"فيديو","كتب":"كتاب",
  "كيلو":"كيلومتر","كيلومترات":"كيلومتر","خطوه":"خطوة","خطوات":"خطوة",
  "مشاريع":"مشروع","مهام":"مهمة","مهمه":"مهمة","اوراق":"ورقة","ورقه":"ورقة",
  "مقالات":"مقال","اكواب":"كوب","كاسات":"كوب","وجبات":"وجبة","وجبه":"وجبة",
  "ملخصات":"ملخص","نماذج":"نموذج","اختبارات":"اختبار","محادثات":"محادثة",
  "كلمات":"كلمة","كلمه":"كلمة","جمل":"جملة","جمله":"جملة","سور":"سورة","سوره":"سورة"
};
/* كلمات لا تصلح أن تكون وحدة (زمنية أو أدوات) */
const NOT_UNIT = /^(يوم|ايام|اسبوع|اسابيع|شهر|اشهر|شهور|سنه|سنين|سنوات|ساعه?|في|من|علي|كل|هذا|هذه|هال|ال)$/;

/* بالصيغة المطبّعة: «أبغى» تصير «ابغي» بعد توحيد الألف والياء */
const INTENT_PAT = /^(ابغي|ابغا|ابي|اريد|ودي|بدي|خلني|لازم|يجب|عايز|محتاج|حاب|نفسي)\s+/;

function fehm(raw) {
  const src = raw || "";
  const { norm, map } = normMap(src);
  /* `work` هو النص المطبّع، ونفرّغ منه كل مقطع نستهلكه حتى لا يُطابَق مرتين.
     الطول ثابت دائمًا فتبقى الفهارس صالحة للرجوع إلى النص الأصلي. */
  let work = norm;
  const cuts = [];                       // ما يُحذف من العنوان
  const blank = (a, b) => { work = work.slice(0, a) + " ".repeat(b - a) + work.slice(b); };
  const take = (a, b) => { cuts.push([a, b]); blank(a, b); };
  const orig = (a, b) => src.slice(map[a], (b - 1 < map.length ? map[b - 1] : map[map.length - 1]) + 1);

  /* 1 — أيام الراحة أولًا: «عدا نهاية الأسبوع» تحتوي كلمة «الأسبوع»،
         فلو فحصنا الفترة قبلها لقرأناها مهمة أسبوعية بالخطأ. */
  let rest = [];
  const ex = work.match(EXCLUDE_PAT);
  if (ex) {
    const exStart = ex.index + ex[1].length;      // بعد المسافة الفاصلة
    const tailStart = ex.index + ex[0].length;
    const tail = work.slice(tailStart);
    let far = 0;
    const wk = tail.match(WEEKEND_PAT);
    if (wk) {
      rest = [5, 6];
      far = wk.index + wk[0].length;
    } else {
      DAY_PAT.forEach(([d, re]) => {
        const m = tail.match(re);
        if (m) { rest.push(d); far = Math.max(far, m.index + m[0].length); }
      });
    }
    if (rest.length) {
      rest = [...new Set(rest)].sort((a, b) => a - b);
      take(exStart, tailStart + far);
    }
  }

  /* 2 — الفترة */
  let period = null;
  for (const [p, re] of PERIOD_PAT) {
    const m = work.match(re);
    if (m) { period = p; take(m.index, m.index + m[0].length); break; }
  }

  /* 3 — التقسيم الصريح */
  let split = null;
  for (const [s, re] of SPLIT_PAT) {
    const m = work.match(re);
    if (m) { split = s; take(m.index, m.index + m[0].length); break; }
  }

  /* 4 — المقدار والوحدة.
         يبقيان في العنوان: «أخلص ١٠ محاضرات» اسم أوضح من «أخلص». */
  let target = null, unit = null, explicitNum = false;
  let numEnd = null;
  const dm = work.match(/(\d+(?:[.,]\d+)?)/);
  if (dm) {
    target = parseFloat(dm[1].replace(",", "."));
    explicitNum = true;
    numEnd = dm.index + dm[1].length;
    blank(dm.index, numEnd);
  } else {
    for (const w of Object.keys(NUM_WORDS)) {
      const mm = work.match(new RegExp("(^|\\s)" + w + "(\\s|$)"));
      if (mm) {
        target = NUM_WORDS[w];
        explicitNum = true;
        const s = mm.index + mm[1].length;
        numEnd = s + w.length;
        blank(s, numEnd);
        break;
      }
    }
  }
  if (numEnd != null) {
    const after = work.slice(numEnd).match(/^\s+([؀-ۿ]+)/);
    if (after && !NOT_UNIT.test(after[1])) {
      const s = numEnd + after[0].length - after[1].length;
      /* الشكل المطبّع للبحث في جدول الجموع، والأصلي للعرض (يحفظ الهمزات) */
      unit = UNIT_FIX[after[1]] || orig(s, s + after[1].length);
      blank(s, s + after[1].length);
    }
  }

  /* 5 — العنوان = النص الأصلي بعد حذف المقاطع الوظيفية */
  let title = src;
  cuts.filter(([a, b]) => b > a && a < map.length)
      .map(([a, b]) => [map[a], (b - 1 < map.length ? map[b - 1] : map[map.length - 1]) + 1])
      .sort((x, y) => y[0] - x[0])
      .forEach(([a, b]) => { title = title.slice(0, a) + " " + title.slice(b); });
  title = title.replace(/[\s،,.:؛-]+/g, " ").trim();
  /* نزع كلمة النية من البداية — بمطابقة مطبّعة حتى تعمل مع «أبغى» و«ابغى» */
  const tm = normMap(title).norm.match(INTENT_PAT);
  if (tm) title = title.slice(normMap(title).map[tm[0].length - 1] + 1).trim();
  title = title.replace(/\s{2,}/g, " ").trim();

  /* 6 — الافتراضات الذكية لما لا يصرّح المستخدم */
  const guessedPeriod = !period;
  if (!period) period = explicitNum && target > 1 ? "weekly" : "daily";
  /* «٣ ساعات كل يوم عدا نهاية الأسبوع» لا تُمثَّل كمهمة يومية — كل يوم فيها
     فترة مستقلة لا تعرف أيام الراحة. تحويلها إلى أسبوعية مقسّمة على الأيام
     يعطي النتيجة نفسها بالضبط: ٣ × ٥ أيام = ١٥ أسبوعيًا. */
  let converted = false;
  if (period === "daily" && rest.length && rest.length < 7) {
    period = "weekly";
    target = round2((target == null ? 1 : target) * (7 - rest.length));
    converted = true;
  }

  if (!split || !PERIODS[period].splits.includes(split)) split = bestSplit(period);
  if (split !== "day") rest = [];
  if (target == null) target = 1;
  const noUnit = !unit;
  if (!unit) unit = target === 1 ? "مرة" : "وحدة";
  if (!title) title = "مهمة جديدة";

  return {
    title, unit, target, period, split, rest,
    guessedPeriod, converted,
    guessedUnit: noUnit,
    guessedTarget: !explicitNum
  };
}

/* Enumerate leaf slots of a period at a granularity. */
function enumSlots(range, gran, dw) {
  const out = [];
  if (gran === "day") {
    for (let d = new Date(range.start); d <= range.end; d = addDays(d, 1)) {
      out.push({ k: key(d), gran: "day", start: new Date(d), end: new Date(d), rest: dw[d.getDay()] === 0 });
    }
  } else if (gran === "week") {
    for (let s = startOfWeek(range.start); s <= range.end; s = addDays(s, 7)) {
      const e = addDays(s, 6);
      out.push({
        k: "w" + key(s), gran: "week",
        start: s < range.start ? new Date(range.start) : new Date(s),
        end:   e > range.end   ? new Date(range.end)   : new Date(e),
        rest: false
      });
    }
  } else if (gran === "month") {
    let y = range.start.getFullYear(), m = range.start.getMonth();
    while (new Date(y, m, 1) <= range.end) {
      const ms = new Date(y, m, 1), me = new Date(y, m + 1, 0);
      out.push({
        k: `m${y}-${pad(m + 1)}`, gran: "month",
        start: ms < range.start ? new Date(range.start) : ms,
        end:   me > range.end   ? new Date(range.end)   : me,
        rest: false
      });
      if (++m > 11) { m = 0; y++; }
    }
  } else {
    out.push({ k: "all", gran: "period", start: new Date(range.start), end: new Date(range.end), rest: false });
  }
  /* الخانة التي كل أيامها راحة لا تحمل عملًا */
  out.forEach(s => { s.active = weightSpan(s.start, s.end, dw); if (s.active === 0) s.rest = true; });
  return out;
}

const rangeTxt = (a, b) => a.getDate() === b.getDate()
  ? ltr(String(a.getDate()))
  : ltr(a.getDate() + " – " + b.getDate());
/* <bdi dir="ltr"> is the only bulletproof way to keep "2 – 8" from flipping */
const rangeHtml = (a, b) => `<bdi dir="ltr">${a.getDate() === b.getDate()
  ? a.getDate() : a.getDate() + " – " + b.getDate()}</bdi>`;

/* returns HTML (already safe — dates only) */
function slotLabel(s) {
  if (s.gran === "day")   return `${DAY_SHORT[s.start.getDay()]} <bdi dir="ltr">${s.start.getDate()}</bdi>`;
  if (s.gran === "week")  return rangeHtml(s.start, s.end);
  if (s.gran === "month") return esc(MONTHS[s.start.getMonth()]);
  return "الفترة";
}
function slotLong(s) {
  if (s.gran === "day")   return `${DAY_FULL[s.start.getDay()]} ${ltr(s.start.getDate())} ${MONTHS[s.start.getMonth()]}`;
  if (s.gran === "week")  return `أسبوع ${rangeTxt(s.start, s.end)} ${MONTHS[s.end.getMonth()]}`;
  if (s.gran === "month") return `${MONTHS[s.start.getMonth()]} ${ltr(s.start.getFullYear())}`;
  return "كامل الفترة";
}

/*
  compute(task, ref)
  ------------------
  Returns everything the UI needs for one period instance:
   • slots[]  each with { plan, done, todo, missed, state }
   • target / doneTotal / remaining          ← the "10 becomes 8" number
   • pace (expected-by-now) & status
*/
/* الذاكرة المؤقتة تعيش عبر عمليات الرسم، ويبطلها تغيّر البيانات وحده.
   قبلًا كانت تُمسح مع كل رسم، فيُعاد حساب كل شيء عند كل ضغطة. */
let _dv = 0;                       // رقم إصدار البيانات
const _cc = new Map();
const _ds = new Map();             // ذاكرة نتيجة اليوم
const bust = () => { _dv++; _cc.clear(); _ds.clear(); };

function compute(task, ref) {
  ref = ref || today();
  const ck = task.id + "|" + periodKey(task.period, ref) + "|" + task.split + "|" +
             task.target + "|" + dayws(task).join("") + "|" + task.catchup + "|" +
             (task.curve || "even") + "|" + _dv;
  const hit = _cc.get(ck);
  if (hit) return hit;
  const out = compute_(task, ref);
  _cc.set(ck, out);
  return out;
}

function compute_(task, ref) {
  const t = today();
  const range = periodRange(task.period, ref);
  const pk = periodKey(task.period, ref);
  const dw = dayws(task);
  const curve = task.curve || "even";
  const dec = Number.isInteger(task.target) ? 0 : 1;
  const slots = enumSlots(range, task.split, dw);
  const prog = (S.progress[task.id] || {})[pk] || {};

  /* 1 — الخطة الأصلية: وزن اليوم × منحنى الفترة */
  const live0 = slots.filter(s => !s.rest);
  const cf = new Map();
  live0.forEach((s, i) => cf.set(s.k, curveFactor(curve, i, live0.length)));
  const plan = distribute(task.target, slots.map(s => s.active * (cf.get(s.k) || 1)), dec);
  let doneTotal = 0;
  slots.forEach((s, i) => {
    s.plan = plan[i];
    s.done = round2(+prog[s.k] || 0);
    doneTotal = round2(doneTotal + s.done);
  });

  const remaining = Math.max(0, round2(task.target - doneTotal));

  /* 2 — smart rebalance: anything missed rolls forward onto what's left */
  const live = slots.filter(s => s.end >= t && !s.rest);
  if (task.catchup !== false && live.length) {
    const w = live.map((s, i) => {
      const from = s.start < t ? t : s.start;      // فقط الأيام التي ما زالت أمامنا
      return Math.max(weightSpan(from, s.end, dw), 0.25) * curveFactor(curve, i, live.length);
    });
    const todo = distribute(remaining, w, dec);
    live.forEach((s, i) => { s.todo = todo[i]; });
  } else {
    live.forEach(s => { s.todo = Math.max(0, round2(s.plan - s.done)); });
  }
  /* days that fell before the task even existed are not failures */
  const born = parseKey(task.created || key(t));
  slots.forEach(s => {
    if (s.todo == null) s.todo = 0;
    const past = s.end < t;
    s.past   = past;
    s.pre    = s.end < born;
    s.now    = s.start <= t && t <= s.end;
    s.missed = past && !s.pre ? Math.max(0, round2(s.plan - s.done)) : 0;
    s.state  = s.rest ? "rest"
             : s.done >= s.plan && s.plan > 0 ? "ok"
             : s.pre ? "pre"
             : past ? (s.missed > 0 ? "miss" : "ok")
             : "open";
  });
  /* period already over but work left → pin it on the last real slot */
  if (!live.length && remaining > 0) {
    const last = [...slots].reverse().find(s => !s.rest);
    if (last) last.todo = remaining;
  }

  /* 3 — pace: what should already be finished when today *starts*.
         Today's own share is not counted yet, so an untouched morning
         never reports you as behind. */
  let expected = 0;
  slots.forEach(s => {
    if (s.pre) expected += s.done;
    else if (s.end < t) expected += s.plan;
  });
  expected = Math.min(task.target, round2(expected));
  const drift = round2(doneTotal - expected);
  const status = remaining === 0 ? "done" : drift >= 0.5 ? "ahead" : drift <= -0.5 ? "behind" : "ontrack";

  const cur = slots.find(s => s.now && !s.rest) || null;
  const daysLeft = Math.max(0, Math.round((range.end - t) / 864e5) + (t <= range.end ? 1 : 0));

  return {
    task, pk, range, slots, target: task.target, doneTotal, remaining,
    expected, drift, status, cur, daysLeft,
    pct: task.target > 0 ? Math.min(1, doneTotal / task.target) : 0,
    pacePct: task.target > 0 ? Math.min(1, expected / task.target) : 0
  };
}

/* group leaf slots into a coarser band for readable breakdowns */
function groupBy(period, leaf) {
  if (leaf === "day"  && period !== "weekly" && period !== "daily") return "week";
  if (leaf === "week" && (period === "quarterly" || period === "half" || period === "yearly")) return "month";
  return null;
}
/* roll leaf slots up into bands — the result is slot-shaped, so meter() renders it too */
function makeGroups(slots, gran) {
  const map = new Map();
  slots.forEach(s => {
    const g = gran === "week" ? "w" + key(startOfWeek(s.start))
                              : `m${s.start.getFullYear()}-${pad(s.start.getMonth() + 1)}`;
    if (!map.has(g)) map.set(g, { k: g, gran, slots: [], plan: 0, done: 0, todo: 0,
                                  missed: 0, active: 0, start: s.start, end: s.end });
    const o = map.get(g);
    o.slots.push(s);
    o.plan   = round2(o.plan + s.plan);
    o.done   = round2(o.done + s.done);
    o.todo   = round2(o.todo + s.todo);
    o.missed = round2(o.missed + s.missed);
    o.active += s.active;
    if (s.start < o.start) o.start = s.start;
    if (s.end   > o.end)   o.end   = s.end;
  });
  const t = today();
  return [...map.values()].map(g => {
    g.rest = g.active === 0;
    g.past = g.end < t;
    g.now  = g.start <= t && t <= g.end;
    g.pre  = g.slots.every(s => s.pre);
    g.state = g.rest ? "rest"
            : g.done >= g.plan && g.plan > 0 ? "ok"
            : g.pre ? "pre"
            : g.past ? (g.missed > 0 ? "miss" : "ok")
            : "open";
    return g;
  });
}

/* how much of a task lands on one specific date (for calendar + streaks) */
function dayShare(task, date) {
  const c = compute(task, date);
  const s = c.slots.find(x => x.start <= date && date <= x.end);
  if (!s || s.rest) return null;
  if (s.gran === "day") return { plan: s.plan, done: s.done, todo: s.todo, exact: true };
  const n = Math.max(1, s.active);
  return { plan: round2(s.plan / n), done: round2(s.done / n), todo: round2(s.todo / n), exact: false };
}

const liveTasks = () => S.tasks.filter(t => !t.archived);

/* today's board */
function todayBoard() {
  const t = today();
  return liveTasks().map(task => {
    const c = compute(task, t);
    const s = c.cur;
    if (!s) return null;
    const goal = round2(s.done + s.todo);
    return { task, c, slot: s, done: s.done, goal, todo: s.todo, complete: s.todo <= 0, idle: goal <= 0 };
  }).filter(Boolean)
    .sort((a, b) => (a.complete - b.complete) || (PERIODS[a.task.period].order - PERIODS[b.task.period].order));
}

function dayScore(date) {
  const dk = key(date);
  const hit = _ds.get(dk);
  if (hit !== undefined) return hit;
  let sum = 0, n = 0;
  liveTasks().forEach(task => {
    if (parseKey(task.created) > date) return;
    const sh = dayShare(task, date);
    /* only tasks tracked at day resolution can be judged per day —
       a weekly bucket isn't "unfinished" just because it's Tuesday */
    if (!sh || !sh.exact || sh.plan <= 0) return;
    n++;
    sum += Math.min(1, sh.done / sh.plan);
  });
  const out = n ? { score: sum / n, n } : null;
  _ds.set(dk, out);
  return out;
}

function streaks() {
  const t = today();
  let best = 0, run = 0, cur = 0, seenToday = false;
  for (let i = 120; i >= 0; i--) {
    const s = dayScore(addDays(t, -i));
    if (!s) continue;
    if (s.score >= 0.999) { run++; best = Math.max(best, run); }
    else if (i > 0) run = 0;          /* يوم اليوم لم ينتهِ بعد فلا يكسر السلسلة */
    else seenToday = true;
    if (i === 0) cur = run;
  }
  if (seenToday) cur = run;
  return { cur, best: Math.max(best, cur) };
}

/* ============================================================
   6. MUTATIONS
   ============================================================ */
function logProgress(taskId, pk, slotKey, delta, silent) {
  const p = S.progress[taskId] || (S.progress[taskId] = {});
  const inst = p[pk] || (p[pk] = {});
  const before = +inst[slotKey] || 0;
  const after = Math.max(0, round2(before + delta));
  inst[slotKey] = after;
  if (after === 0) delete inst[slotKey];
  lastAction = { taskId, pk, slotKey, before };
  save();
  render();
  if (!silent) {
    const task = S.tasks.find(t => t.id === taskId);
    const c = compute(task);
    toast(
      c.remaining === 0 ? `تمّت «${task.title}» بالكامل` : `باقي ${fmt(c.remaining)} ${task.unit}`,
      "تراجع", undoLast
    );
  }
}
function setProgress(taskId, pk, slotKey, value) {
  const p = S.progress[taskId] || (S.progress[taskId] = {});
  const inst = p[pk] || (p[pk] = {});
  lastAction = { taskId, pk, slotKey, before: +inst[slotKey] || 0 };
  const v = Math.max(0, round2(value));
  if (v === 0) delete inst[slotKey]; else inst[slotKey] = v;
  save(); render();
}
function undoLast() {
  if (!lastAction) return;
  const { taskId, pk, slotKey, before } = lastAction;
  const inst = ((S.progress[taskId] || {})[pk]) || {};
  if (before === 0) delete inst[slotKey]; else inst[slotKey] = before;
  lastAction = null;
  save(); render();
}

const STATUS_TAG = {
  done:    { cls:"ok",   txt:"مكتملة" },
  ahead:   { cls:"ok",   txt:"متقدم على الخطة" },
  ontrack: { cls:"",     txt:"على المسار" },
  behind:  { cls:"bad",  txt:"متأخر — أعيد التوزيع" }
};

/* the segmented distribution meter */
function meter(c, slots, opts) {
  opts = opts || {};
  /* min width keeps a 31-cell month scrollable instead of crushed */
  const cols = slots.map(s =>
    `minmax(${s.gran === "day" ? 30 : 58}px,${Math.max(s.active || 1, 0.6)}fr)`).join(" ");
  const cells = slots.map(s => {
    const goal = round2(s.done + s.todo);
    const shown = s.past ? s.plan : (goal || s.plan);
    /* fill measures this slot against its own goal — a finished day reads as finished */
    const h = shown > 0 ? Math.min(100, (s.done / shown) * 100) : (s.done > 0 ? 100 : 0);
    const cls = ["cell", s.state, s.past ? "past" : "", s.now ? "now" : "",
                 s.done >= shown && shown > 0 ? "full" : ""].filter(Boolean).join(" ");
    const tip = `${slotLong(s)} — الخطة ${fmt(s.plan)} · أنجزت ${fmt(s.done)}${s.todo > 0 ? ` · مطلوب ${fmt(s.todo)}` : ""}`;
    const label = s.rest ? "راحة" : fmt(s.past ? s.done : (s.todo > 0 ? s.todo : s.done));
    const tag = opts.clickable ? "button" : "div";
    const attrs = opts.clickable
      ? ` data-act="cell" data-task="${c.task.id}" data-pk="${c.pk}" data-slot="${s.k}"` : "";
    return `<${tag} class="${cls}" title="${esc(tip)}"${attrs}>
      <span class="fill" style="height:${h}%"></span>
      <span class="n">${label}</span>
    </${tag}>`;
  }).join("");
  const labels = slots.map(s => `<span class="lab ${s.now ? "now" : ""}">${slotLabel(s)}</span>`).join("");
  /* keep a 2-cell meter from stretching across the whole card */
  const cap = slots.length * 150 + (slots.length - 1) * 5;
  return `<div class="dist" style="grid-template-columns:${cols};max-width:${cap}px">${cells}${labels}</div>`;
}

/* ============================================================
   REFLECTION
   تأمل مربوط بأرقام اليوم، ومخرجاته تتحول إلى أنماط في «الإحصاءات»

const BLOCKERS = ["ضيق الوقت", "تشتت", "إرهاق", "تسويف", "ظرف طارئ", "الهدف كبير", "انشغال بالعمل", "صحة"];
const ENERGY = ["منخفضة جدًا", "منخفضة", "متوسطة", "عالية", "ممتازة"];

let reflDraft = null;      // مسودة اليوم قبل الحفظ
let reflOpen = false;      // مطوي افتراضيًا

/* الحالة الحالية: المسودة، وإلا المحفوظ، وإلا فارغ */
function reflCurrent() {
  if (reflDraft) return reflDraft;
  const s = S.reflect[key(today())];
  return s ? { energy: s.energy || 0, blocks: [...(s.blocks || [])], win: s.win || "", fix: s.fix || "" }
           : { energy: 0, blocks: [], win: "", fix: "" };
}

function dayFacts(d) {
  const board = todayBoard();
  let planned = 0, done = 0, hit = 0, n = 0;
  board.forEach(b => {
    const goal = round2(b.done + b.todo);
    if (goal <= 0 && b.done <= 0) return;
    n++; planned += goal; done += b.done;
    if (b.todo <= 0) hit++;
  });
  return { n, hit, planned: round2(planned), done: round2(done),
           pct: planned > 0 ? Math.min(1, done / planned) : (n ? 1 : 0) };
}

function renderReflect() {
  const dk = key(today());
  const saved = S.reflect[dk];
  const f = dayFacts();
  const d = reflDraft || (saved ? JSON.parse(JSON.stringify(saved)) : { energy: 0, blocks: [], win: "", fix: "" });

  const facts = `
    <div class="facts">
      <div class="fact"><div class="k">أنجزت اليوم</div>
        <div class="v">${fmt(f.done)}<small> / ${fmt(f.planned)}</small></div></div>
      <div class="fact"><div class="k">مهام أُقفلت</div>
        <div class="v">${f.hit}<small> / ${f.n}</small></div></div>
      <div class="fact"><div class="k">نسبة اليوم</div>
        <div class="v">${Math.round(f.pct * 100)}<small>%</small></div></div>

  const energy = `
    <div class="field">
      <label>طاقتك اليوم</label>
      <div class="energy">
        ${ENERGY.map((lab, i) => `
          <button data-act="energy" data-v="${i + 1}" aria-pressed="${d.energy === i + 1}" title="${lab}">
            <span class="lvl">${Array.from({ length: 5 }, (_, k) =>
              `<i class="${k <= i ? "on" : ""}" style="height:${5 + k * 3}px"></i>`).join("")}</span>
            ${lab}
          </button>`).join("")}
      </div>
    </div>`;

  const blocks = `
    <div class="field">
      <label>وش عطّلك؟ <span class="note">(اختياري — أكثر من واحد)</span></label>
      <div class="chips">
        ${BLOCKERS.map(bk => `<button class="chip" data-act="block" data-v="${esc(bk)}"
            aria-pressed="${d.blocks.includes(bk)}">${bk}</button>`).join("")}
      </div>
    </div>`;

  const sub = saved
    ? `طاقة ${ENERGY[saved.energy - 1] || "—"}${saved.blocks.length ? ` · ${saved.blocks.join("، ")}` : ""}`
    : "دقيقة واحدة — تتحول إلى أنماط في «الإحصاءات»";

  return `
  <div class="refl">
    <button class="refl-head" data-act="reflToggle" aria-expanded="${reflOpen}">
      <span style="color:${saved ? "var(--ok)" : "var(--brass)"};display:flex">
        ${icon(saved ? "check" : "spark", 17)}</span>
      <span style="flex:1">
        <h3>تأمل اليوم</h3>
        <span class="sub">${esc(sub)}</span>
      </span>
      <span class="chev">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </span>
    </button>
    ${!reflOpen ? "" : `
    <div class="refl-body">
      ${facts}
      ${energy}
      ${blocks}
      <div class="row2">
        <div class="field">
          <label for="rWin">وش مشى صح؟</label>
          <textarea class="refl-note" id="rWin" data-r="win" rows="2"
            placeholder="أصغر شيء نجح معك اليوم">${esc(d.win)}</textarea>
        </div>
        <div class="field">
          <label for="rFix">وش تعدّله بكرة؟</label>
          <textarea class="refl-note" id="rFix" data-r="fix" rows="2"
            placeholder="تغيير واحد قابل للتنفيذ">${esc(d.fix)}</textarea>
        </div>

      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn btn-primary" data-act="reflSave">${saved ? "تحديث" : "حفظ"}</button>
        ${saved ? `<span class="spacer"></span>

}

/* ============================================================
   INSIGHTS — الأنماط المستخرجة من التأملات + سجل الإنجاز
   ============================================================ */
function insights() {
  const t = today();
  const out = {};

  /* 1 — الأداء بحسب يوم الأسبوع (٨ أسابيع) */
  const byDay = Array.from({ length: 7 }, () => ({ sum: 0, n: 0 }));
  for (let i = 1; i <= 56; i++) {
    const d = addDays(t, -i);
    const s = dayScore(d);
    if (!s) continue;
    const b = byDay[d.getDay()];
    b.sum += s.score; b.n++;
  }
  const avail = byDay.map((b, i) => ({ i, avg: b.n ? b.sum / b.n : null, n: b.n })).filter(x => x.avg != null);
  if (avail.length >= 3) {
    const best = avail.reduce((a, b) => (b.avg > a.avg ? b : a));
    const worst = avail.reduce((a, b) => (b.avg < a.avg ? b : a));
    out.week = { byDay, best: best.i, worst: worst.i, bestAvg: best.avg, worstAvg: worst.avg };
  }

  /* 2 — أكثر ما يعطّلك */
  const counts = {};
  let refN = 0, eHi = { s: 0, n: 0 }, eLo = { s: 0, n: 0 };
  Object.keys(S.reflect).forEach(dk => {
    const r = S.reflect[dk];
    refN++;
    (r.blocks || []).forEach(b => { counts[b] = (counts[b] || 0) + 1; });
    if (typeof r.score === "number" && r.energy) {
      if (r.energy >= 4) { eHi.s += r.score; eHi.n++; }
      else if (r.energy <= 2) { eLo.s += r.score; eLo.n++; }
    }
  });
  out.refN = refN;
  const blocks = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 4);
  if (blocks.length) out.blocks = { list: blocks, max: blocks[0][1] };
  if (eHi.n >= 2 && eLo.n >= 2) out.energy = { hi: eHi.s / eHi.n, lo: eLo.s / eLo.n, nHi: eHi.n, nLo: eLo.n };

  /* 3 — دقة التقدير: كم من الهدف تُغلق فعليًا في الفترات المنتهية */
  let ratio = 0, rn = 0;
  liveTasks().forEach(task => {
    for (let k = 1; k <= 4; k++) {
      const ref = periodBack(task.period, k);
      if (!ref || ref < parseKey(task.created)) break;
      const c = compute(task, ref);
      if (c.target <= 0 || c.range.end >= t) continue;
      ratio += Math.min(1.5, c.doneTotal / c.target); rn++;
    }
  });
  if (rn >= 2) out.estimate = { avg: ratio / rn, n: rn };

  return out;
}

/* تاريخ يقع داخل الفترة السابقة رقم k — بالمشي فترةً فترة، لا بتقريب الأيام */
function periodBack(period, k) {
  let d = addDays(periodRange(period, today()).start, -1);
  for (let i = 1; i < k; i++) d = addDays(periodRange(period, d).start, -1);
  return d;
}

function renderToday() {
  const board = todayBoard();
  const t = today();
  const doneCount = board.filter(b => b.complete).length;
  const pct = board.length ? doneCount / board.length : 0;

  const st = streaks();
  const unitsToday = board.reduce((a, b) => a + b.todo, 0);
  const behind = liveTasks().map(x => compute(x)).filter(c => c.status === "behind").length;

  if (!board.length) {
    return magicBar(true) + `<div class="empty"><h3>لا مهام بعد</h3>
      <p>اكتب مهمتك بالأعلى بلغتك العادية — يفهم «مقياس» المقدار والفترة وأيام الراحة،
         ويقسّمها عليك حتى يوصل لنصيب اليوم.</p></div>`;
  }

  const R = 26, C = 2 * Math.PI * R;
  const summary = `
  <div class="pulse">
    <div class="ring">
      <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="7"/>
        <circle cx="32" cy="32" r="${R}" fill="none" stroke="var(--accent)" stroke-width="7"
                stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}"
                stroke-dashoffset="${(C * (1 - pct)).toFixed(1)}"/>
      </svg>
      <span class="ring-n">${Math.round(pct * 100)}<small>%</small></span>
    </div>
    <div class="pulse-txt">
      <b>${doneCount} من ${board.length} مهام</b>
      <span>باقٍ <i class="num">${fmt(unitsToday)}</i> وحدة اليوم${
        st.cur ? ` · <i class="num">${st.cur}</i> يوم متتالٍ` : ""}${
        behind ? ` · <i class="num" style="color:var(--brass)">${behind}</i> أُعيد توزيعها` : ""}</span>
    </div>
  </div>`;

  const cards = board.map(b => {
    const { task, c, slot } = b;
    const per = PERIODS[task.period];
    const when = slot.gran === "day" ? "اليوم"
               : slot.gran === "week" ? "هذا الأسبوع"
               : slot.gran === "month" ? "هذا الشهر" : per.short;
    return `
    <article class="tcard ${b.complete ? "done" : ""} ${b.idle ? "idle" : ""}" style="--tc:${colorVar(task.color)}">
      <div class="tc-top">
        <button class="check" data-act="toggle" data-task="${task.id}"
                aria-label="إنهاء نصيب ${when} من ${esc(task.title)}">${icon("check", 17)}</button>
        <div class="tc-id">
          <h3 class="tc-title">${esc(task.title)}</h3>
          <div class="tc-sub">باقٍ <b>${fmt(c.remaining)}</b> من ${fmt(c.target)} ${esc(task.unit)} في ${per.short}</div>
        </div>
      </div>
      <div class="tc-act">
        <div class="tc-big ${b.complete ? "ok" : ""}">
          <b>${b.idle ? "—" : fmt(b.todo)}</b>
          <i>${b.idle ? `لا شيء<br>${when}` : `${esc(task.unit)}<br>${when}`}</i>
        </div>
        ${b.idle ? "" : `<div class="step">
          <button data-act="dec" data-task="${task.id}" aria-label="إنقاص">−</button>
          <span class="val">${fmt(b.done)}</span>
          <button data-act="inc" data-task="${task.id}" aria-label="زيادة">+</button>
        </div>`}
      </div>
      <div class="tc-prog"><i style="width:${(c.pct * 100).toFixed(1)}%"></i></div>
    </article>`;
  }).join("");

  const open = !collapsed.has("today");
  return magicBar() + summary + `
    <div class="secwrap">
      <button class="sec" data-act="sec" data-k="today" aria-expanded="${open}">
        <span class="ic">${icon("today", 18)}</span>
        <h2>مهام اليوم</h2>
        <span class="cnt ${doneCount === board.length ? "full" : ""}">${doneCount}/${board.length}</span>
        <span class="chev">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </span>
      </button>
      ${open ? `<div class="grid">${cards}</div>` : ""}
