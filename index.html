    ${renderReflect()}`;
}

function renderTasks() {
  const tasks = liveTasks().sort((a, b) => PERIODS[a.period].order - PERIODS[b.period].order);
  if (!tasks.length) {
    return `<div class="empty"><h3>لا توجد مهام بعد</h3>
      <p>ابدأ بمهمة مثل «إنهاء 10 محاضرات هذا الأسبوع» واختر تقسيمها على الأيام.</p></div>`;
  }
  const cards = tasks.map(task => {
    const c = compute(task);
    const per = PERIODS[task.period], stt = STATUS_TAG[c.status];
    const gran = groupBy(task.period, task.split);
    const ahead = c.slots.filter(s => !s.rest && s.end >= today());
    const avg = c.remaining / Math.max(1, ahead.length);
    const open = expanded.has(task.id);

    /* البطاقة تعرض النظرة المجمّعة، والتفصيل يُطوى حتى لا تزدحم */
    const band = gran ? makeGroups(c.slots, gran) : c.slots;
    const summary = c.slots.length <= 1 ? ""
      : `<div class="dist-scroll">${meter(c, band, { clickable: !gran })}</div>`;

    let detail = "";
    if (open && gran) {
      detail = `<div class="grp">` + makeGroups(c.slots, gran).map(g => `
        <div class="grp-row ${g.now ? "now" : ""}">
          <div>
            <div class="grp-name">${gran === "week"
              ? `أسبوع ${rangeHtml(g.start, g.end)} ${MONTHS[g.end.getMonth()]}`
              : `${MONTHS[g.start.getMonth()]}`}</div>
            <div class="grp-sub">مطلوب ${fmt(g.todo)} · أنجزت ${fmt(g.done)}</div>
          </div>
          <div class="dist-scroll">${meter(c, g.slots, { clickable: true })}</div>
        </div>`).join("") + `</div>`;
    }

    return `
    <article class="tcard" style="--tc:${colorVar(task.color)}">
      <div class="tc-top">
        <div class="tc-id">
          <h3 class="tc-title">${esc(task.title)}</h3>
          <div class="tc-sub">
            ${per.label} · ${SPLITS[task.split].label}
            ${c.daysLeft > 0 ? ` · ${c.daysLeft} يوم متبقي` : " · انتهت الفترة"}
          </div>
          ${c.status !== "ontrack"
            ? `<span class="tag ${stt.cls}" style="display:inline-block;margin-top:9px">${stt.txt}</span>` : ""}
        </div>
        <div class="tc-links">
          <button class="ibtn" data-act="edit" data-task="${task.id}" aria-label="تعديل">${icon("edit", 15)}</button>
          <button class="ibtn danger" data-act="del" data-task="${task.id}" aria-label="حذف">${icon("trash", 15)}</button>
        </div>
      </div>

      <div class="tc-act">
        <div class="tc-big ${c.remaining === 0 ? "ok" : ""}">
          <b>${fmt(c.remaining)}</b>
          <i>${esc(task.unit)} باقية<br>من ${fmt(c.target)} · ≈ ${fmt(avg)} ${SPLITS[task.split].each}</i>
        </div>
        <div class="step">
          <button data-act="dec" data-task="${task.id}" aria-label="إنقاص">−</button>
          <span class="val">${fmt(c.cur ? c.cur.done : 0)}</span>
          <button data-act="inc" data-task="${task.id}" aria-label="زيادة">+</button>
        </div>
      </div>

      ${summary ? `<div class="tc-meter">${summary}</div>` : ""}

      <div class="tc-prog"><i style="width:${(c.pct * 100).toFixed(1)}%"></i></div>

      ${gran ? `<button class="disclose" data-act="expand" data-task="${task.id}" aria-expanded="${open}">
        ${open ? "إخفاء التفصيل" : "التفصيل اليومي"}
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>` : ""}
      ${detail ? `<div class="tc-detail">${detail}</div>` : ""}
    </article>`;
  }).join("");

  return `<div class="grid wide">${cards}</div>`;
}

/* ============================================================
   لوحة التوزيع: صفٌّ لكل مهمة، وعمودٌ لكل يوم، ومحصّلة الحمل أسفلها
   ============================================================ */
let boardRef = null;

function weekBoard(ref) {
  const ws = startOfWeek(ref);
  const days = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
  const rows = liveTasks().map(task => {
    const cells = days.map(d => {
      const sh = dayShare(task, d);
      return sh ? sh : { plan: 0, done: 0, todo: 0, exact: true, off: true };
    });
    return { task, cells };
  }).filter(r => r.cells.some(c => c.plan > 0 || c.done > 0));

  const totals = days.map((_, i) => round2(rows.reduce((a, r) => a + (r.cells[i].todo || 0), 0)));
  const plans  = days.map((_, i) => round2(rows.reduce((a, r) => a + (r.cells[i].plan || 0), 0)));
  const busy   = plans.filter(v => v > 0);
  const median = busy.length ? busy.slice().sort((a, b) => a - b)[Math.floor(busy.length / 2)] : 0;
  return { ws, days, rows, totals, plans, max: Math.max(...plans, 1), median };
}

function renderBoard() {
  const t = today();
  const ref = boardRef || t;
  const B = weekBoard(ref);
  const isNow = key(startOfWeek(t)) === key(B.ws);

  if (!B.rows.length) {
    return `<div class="empty"><h3>لا توزيع بعد</h3>
      <p>أضف مهمة وسيظهر هنا نصيب كل يوم منها، ومجموع حِملك اليومي.</p></div>`;
  }

  const head = `<div class="bname"></div>` + B.days.map(d => {
    const now = sameDay(d, t);
    return `<div class="bh ${now ? "now" : ""}">${DAY_SHORT[d.getDay()].slice(0, 3)}<b>${ltr(d.getDate())}</b></div>`;
  }).join("");

  /* display:contents يُبقي الخلايا في شبكة اللوحة، ويحمل لون المهمة للصف */
  const rows = B.rows.map(r => {
    const cells = r.cells.map((c, i) => {
      const d = B.days[i];
      if (c.off) return `<div class="bcell off"><span class="n">—</span></div>`;
      const past = d < t, now = sameDay(d, t);
      const goal = round2(c.done + c.todo) || c.plan;
      const p = goal > 0 ? Math.min(100, (c.done / goal) * 100) : 0;
      const cls = ["bcell",
        past && c.done < c.plan ? "miss" : "",
        now ? "now" : "",
        goal > 0 && c.done >= goal ? "done" : "",
        c.exact ? "" : "est"].filter(Boolean).join(" ");
      const tag = c.exact ? "button" : "div";
      const at = c.exact ? ` data-act="bcell" data-task="${r.task.id}" data-d="${key(d)}"` : "";
      return `<${tag} class="${cls}"${at} title="${esc(DAY_FULL[d.getDay()])} — ${fmt(c.done)} / ${fmt(goal)}">
        <span class="f" style="height:${p}%"></span>
        <span class="n">${c.exact ? fmt(past ? c.done : (c.todo > 0 ? c.todo : c.done)) : "·"}</span></${tag}>`;
    }).join("");
    return `<div style="display:contents;--tc:${colorVar(r.task.color)}">
      <div class="bname"><i></i><span title="${esc(r.task.title)}">${esc(r.task.title)}</span></div>
      ${cells}
    </div>`;
  }).join("");

  const tot = `<div class="bname">الحمل</div>` + B.plans.map((v, i) => {
    const hot = B.median > 0 && v > B.median * 1.6;
    return `<div class="bcell ${hot ? "hot" : ""}" title="مجموع المخطط">
      <span class="f" style="height:${Math.min(100, (v / B.max) * 100)}%"></span>
      <span class="n">${v > 0 ? fmt(Math.round(v)) : "—"}</span></div>`;
  }).join("");

  const heavy = B.plans.map((v, i) => ({ v, i }))
    .filter(x => B.median > 0 && x.v > B.median * 1.6)
    .map(x => DAY_FULL[B.days[x.i].getDay()]);

  return `
  <div class="card" style="padding:18px">
    <h3 style="font-size:14px;color:var(--text-2);margin-bottom:11px">
      ${rangeHtml(B.ws, addDays(B.ws, 6))} ${MONTHS[addDays(B.ws, 6).getMonth()]}</h3>
    <div class="wknav">
      <button class="pillbtn" data-act="bwk" data-v="-1">رجوع</button>
      <button class="pillbtn ${isNow ? "on" : ""}" data-act="bwk" data-v="0">هذا الأسبوع</button>
      <button class="pillbtn" data-act="bwk" data-v="1">التالي</button>
    </div>
    <div class="board-scroll">
      <div class="board">${head}${rows}<div class="btot" style="display:contents">${tot}</div></div>
    </div>
    ${heavy.length ? `<div class="advice" style="margin-top:14px">
      <span>${heavy.join(" و")} أثقل بكثير من بقية أيامك. خفّف شدّته من إعدادات المهمة،
        أو انقل جزءًا منه ليوم أخف.</span></div>` : ""}
    <div class="legend-dots" style="margin-top:14px">
      <span><i style="background:var(--accent)"></i> منجز</span>
      <span><i style="background:var(--bad)"></i> فائت</span>
      <span style="color:var(--text-3)">الخانة المتقطّعة = حصة تقديرية من فترة أكبر</span>
    </div>
  </div>`;
}

function renderCal() {
  const ref = new Date(calRef.getFullYear(), calRef.getMonth(), 1);
  const t = today();
  const first = startOfWeek(ref);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = addDays(first, i);
    const out = d.getMonth() !== ref.getMonth();
    const dots = [];
    let amt = 0;
    liveTasks().forEach(task => {
      const sh = dayShare(task, d);
      if (!sh || sh.plan <= 0) return;
      amt += sh.todo > 0 && d >= t ? sh.todo : sh.plan;
      const cls = sh.done >= sh.plan ? "done" : (d < t ? "miss" : "");
      dots.push(`<i class="${cls}" style="--tc:${colorVar(task.color)}"></i>`);
    });
    cells.push(`
      <button class="day ${out ? "out" : ""} ${sameDay(d, t) ? "today" : ""} ${calSel && sameDay(d, calSel) ? "sel" : ""}"
              data-act="day" data-d="${key(d)}">
        <span class="dn">${d.getDate()}</span>
        <span class="load">${dots.slice(0, 8).join("")}</span>
        <span class="amt">${amt > 0 ? fmt(Math.round(amt)) : ""}</span>
      </button>`);
  }
  const dows = Array.from({ length: 7 }, (_, i) => `<div class="dow">${DAY_SHORT[(S.settings.weekStart + i) % 7]}</div>`).join("");

  let panel = "";
  if (calSel) {
    const rows = liveTasks().map(task => {
      const sh = dayShare(task, calSel);
      if (!sh || sh.plan <= 0) return "";
      return `<tr>
        <td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colorVar(task.color)};margin-inline-end:8px"></span>${esc(task.title)}</td>
        <td class="num">${fmt(sh.plan)}</td>
        <td class="num" style="color:var(--ok)">${fmt(sh.done)}</td>
        <td class="num" style="color:var(--brass)">${fmt(sh.todo)}</td>
        <td style="color:var(--text-3);font-size:12px">${sh.exact ? "نصيب اليوم" : "حصة تقديرية من " + SPLITS[task.split].unitLabel}</td>
      </tr>`;
    }).join("");
    panel = `
      <div class="card" style="padding:18px 20px;margin-top:18px">
        <div class="section-head" style="margin-bottom:12px">
          <h2>${DAY_FULL[calSel.getDay()]} ${calSel.getDate()} ${MONTHS[calSel.getMonth()]}</h2><span class="line"></span></div>
        ${rows ? `<div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>المهمة</th><th>الخطة</th><th>أنجزت</th><th>مطلوب</th><th></th></tr></thead>
          <tbody>${rows}</tbody></table></div>`
        : `<p style="color:var(--text-3);font-size:13px">لا يوجد حمل مجدول في هذا اليوم.</p>`}
      </div>`;
  }

  return `
    <div class="card" style="padding:20px">
      <div class="cal-head">
        <button class="icon-btn" data-act="calprev" aria-label="الشهر السابق">‹</button>
        <h3>${MONTHS[ref.getMonth()]} ${ref.getFullYear()}</h3>
        <button class="icon-btn" data-act="calnext" aria-label="الشهر التالي">›</button>
        <span class="spacer"></span>
        <button class="btn btn-quiet" data-act="caltoday">اليوم</button>
      </div>
      <div class="cal">${dows}${cells.join("")}</div>
      <div class="legend-dots" style="margin-top:14px">
        <span><i style="background:var(--ok)"></i> منجز</span>
        <span><i style="background:var(--accent)"></i> مجدول</span>
        <span><i style="background:var(--bad)"></i> فائت</span>
        <span style="color:var(--text-3)">الرقم أسفل اليوم = مجموع الوحدات المطلوبة</span>
      </div>
    </div>${panel}`;
}

function renderInsights() {
  const q = insights();
  const cards = [];

  if (q.week) {
    const vals = q.week.byDay.map(b => (b.n ? b.sum / b.n : 0));
    const bars = Array.from({ length: 7 }, (_, i) => {
      const d = (S.settings.weekStart + i) % 7;
      const cls = d === q.week.best ? "best" : d === q.week.worst ? "worst" : "";
      return { d, cls, v: vals[d] };
    });
    cards.push(`
    <div class="ins-card">
      <div class="ins-k">أداؤك بحسب اليوم</div>
      <div class="wk">
        ${bars.map(b => `<div class="c ${b.cls}" title="${DAY_FULL[b.d]} — ${Math.round(b.v * 100)}%">
            <i style="height:${Math.max(4, b.v * 100)}%"></i></div>`).join("")}
        ${bars.map(b => `<span class="l ${b.cls}">${DAY_SHORT[b.d].slice(0, 3)}</span>`).join("")}
      </div>
      <div class="ins-v">
        أقوى أيامك <b>${DAY_FULL[q.week.best]}</b> (<span class="num">${Math.round(q.week.bestAvg * 100)}%</span>)،
        وأضعفها <b>${DAY_FULL[q.week.worst]}</b> (<span class="num">${Math.round(q.week.worstAvg * 100)}%</span>).
        ${q.week.bestAvg - q.week.worstAvg > 0.25
          ? `الفرق كبير — خفّف حمل ${DAY_FULL[q.week.worst]} أو اجعله يوم راحة.` : ""}
      </div>
    </div>`);
  }

  if (q.blocks) {
    cards.push(`
    <div class="ins-card">
      <div class="ins-k">أكثر ما يعطّلك</div>
      <div class="blk">
        ${q.blocks.list.map(([name, n]) => `
          <div>
            <div class="blk-row"><span>${esc(name)}</span><span class="blk-n">${n}</span></div>
            <div class="blk-bar"><i style="width:${(n / q.blocks.max * 100).toFixed(0)}%"></i></div>
          </div>`).join("")}
      </div>
      <div class="ins-v">مذكور في <b>${q.blocks.list[0][1]}</b> يوم من أصل ${q.refN} سجّلتها.</div>
    </div>`);
  }

  if (q.energy) {
    const diff = Math.round((q.energy.hi - q.energy.lo) * 100);
    cards.push(`
    <div class="ins-card">
      <div class="ins-k">الطاقة مقابل الإنجاز</div>
      <div class="ins-v">
        في أيام الطاقة العالية تنجز <span class="num">${Math.round(q.energy.hi * 100)}%</span> من خطتك،
        وفي أيام الطاقة المنخفضة <span class="num">${Math.round(q.energy.lo * 100)}%</span>.
        ${diff >= 20
          ? `الفارق <b>${diff} نقطة</b> — طاقتك هي العامل الأكبر، لا حجم الخطة.`
          : `الفارق بسيط — إنجازك لا يتأثر كثيرًا بطاقتك.`}
      </div>
    </div>`);
  }

  if (q.estimate) {
    const p = Math.round(q.estimate.avg * 100);
    cards.push(`
    <div class="ins-card">
      <div class="ins-k">دقة تقديرك</div>
      <div class="ins-v">
        في آخر <b>${q.estimate.n}</b> فترة منتهية أنجزت <span class="num">${p}%</span> من الهدف وسطيًا.
        ${p < 80 ? `تضع أهدافًا أكبر من طاقتك — جرّب خفضها بمقدار <b>${100 - p}%</b> وستُغلقها كاملة.`
         : p > 100 ? `تنجز أكثر مما تخطط — ارفع أهدافك قليلًا.`
         : `تقديرك واقعي — استمر عليه.`}
      </div>
    </div>`);
  }

  if (!cards.length) {
    return `<div class="card" style="padding:20px">
      <div class="section-head" style="margin-bottom:12px"><h2>الأنماط</h2><span class="line"></span></div>
      <p style="font-size:13px;color:var(--text-3);line-height:1.75">
        سجّل «تأمل اليوم» في شاشة يومك لبضعة أيام، وستظهر هنا أنماطك:
        أقوى أيام أسبوعك، وأكثر ما يعطّلك، وأثر طاقتك على إنجازك، ومدى واقعية أهدافك.
      </p></div>`;
  }

  return `<div class="section-head"><h2>الأنماط</h2>
    <span class="hint">مستخرجة من تأملاتك وسجل إنجازك</span><span class="line"></span></div>
    <div class="ins">${cards.join("")}</div>`;
}

function renderStats() {
  const t = today();
  const days = Array.from({ length: 30 }, (_, i) => addDays(t, -(29 - i)));
  const scores = days.map(d => dayScore(d));
  const bars = scores.map((s, i) => {
    const p = s ? s.score : 0;
    return `<div class="b ${p >= .999 ? "full" : ""}" title="${days[i].getDate()} ${MONTHS[days[i].getMonth()]} — ${Math.round(p * 100)}%">
      <i style="--p:${Math.max(p * 100, s ? 4 : 0)}%"></i></div>`;
  }).join("");

  const st = streaks();
  const valid = scores.filter(Boolean);
  const avg = valid.length ? valid.reduce((a, b) => a + b.score, 0) / valid.length : 0;
  const perfect = valid.filter(s => s.score >= .999).length;

  const rows = liveTasks().sort((a, b) => PERIODS[a.period].order - PERIODS[b.period].order).map(task => {
    const c = compute(task);
    const stt = STATUS_TAG[c.status];
    return `<tr>
      <td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colorVar(task.color)};margin-inline-end:8px"></span>${esc(task.title)}</td>
      <td>${PERIODS[task.period].label}</td>
      <td class="num">${fmt(c.doneTotal)} / ${fmt(c.target)}</td>
      <td class="num" style="color:var(--brass)">${fmt(c.remaining)}</td>
      <td style="min-width:130px">
        <div class="bar ${c.remaining === 0 ? "done" : ""}" style="--tc:${colorVar(task.color)}">
          <i style="width:${(c.pct * 100).toFixed(1)}%"></i></div>
      </td>
      <td><span class="tag ${stt.cls}">${stt.txt}</span></td>
    </tr>`;
  }).join("");

  return `
  <div class="strip">
    <div class="kpi accent"><span class="k">متوسط الإنجاز — 30 يومًا</span><span class="v">${Math.round(avg * 100)}<small>%</small></span></div>
    <div class="kpi ok"><span class="k">أيام كاملة</span><span class="v">${perfect}<small>/ ${valid.length}</small></span></div>
    <div class="kpi brass"><span class="k">السلسلة الحالية</span><span class="v">${st.cur}<small>يوم</small></span></div>
    <div class="kpi"><span class="k">أطول سلسلة</span><span class="v">${st.best}<small>يوم</small></span></div>
  </div>

  <div class="card" style="padding:20px">
    <div class="section-head" style="margin-bottom:10px"><h2>آخر ٣٠ يومًا</h2>
      <span class="hint">نسبة إنجاز نصيب كل يوم</span><span class="line"></span></div>
    <div class="chart">${bars}</div>
    <div class="chart-x"><span>${days[0].getDate()} ${MONTHS[days[0].getMonth()]}</span><span>اليوم</span></div>
  </div>

  ${renderInsights()}

  <div class="card" style="padding:20px">
    <div class="section-head" style="margin-bottom:12px"><h2>حالة المهام في فترتها الحالية</h2><span class="line"></span></div>
    ${rows ? `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>المهمة</th><th>التكرار</th><th>التقدم</th><th>الباقي</th><th></th><th>الحالة</th></tr></thead>
      <tbody>${rows}</tbody></table></div>` : `<p style="color:var(--text-3);font-size:13px">لا توجد مهام.</p>`}
  </div>`;
}

let draft = null;

function openForm(taskId, parsed) {
  const ex = taskId ? S.tasks.find(t => t.id === taskId) : null;
  draft = ex ? JSON.parse(JSON.stringify(ex)) : {
    id: uid(), title: "", unit: "مرة", target: 1,
    period: "daily", split: "none", rest: [], catchup: true,
    color: COLORS[S.tasks.length % COLORS.length].id,
    created: key(today()), archived: false
  };
  if (parsed) {
    Object.assign(draft, {
      title: parsed.title, unit: parsed.unit, target: parsed.target,
      period: parsed.period, split: parsed.split, rest: parsed.rest
    });
    draft._read = parsed;
  }
  draft._editing = !!ex;
  paintForm();
}
function closeForm() { draft = null; document.getElementById("modalRoot").innerHTML = ""; }

/* live "this is how it will be divided" panel — shared by the form and by typing */
function previewInner(d) {
  const probe = Object.assign({}, d, { target: Number(d.target) || 0 });
  const c = compute(probe, today());
  const open = c.slots.filter(s => !s.rest);
  const per = round2((Number(d.target) || 0) / Math.max(1, open.length));
  const band = groupBy(d.period, d.split);
  const shown = band ? makeGroups(c.slots, band) : c.slots;
  const unit = esc(d.unit || "وحدة");
  return `<div class="preview-title">${icon("spark", 14)} هكذا سيتم التقسيم</div>
    ${open.length ? `
      <div class="dist-scroll">${meter(c, shown, {})}</div>
      ${band ? `<div class="note" style="margin-top:8px">معروض مجمعا ${band === "week" ? "بالأسابيع" : "بالأشهر"} — والتسجيل يبقى ${SPLITS[d.split].each}.</div>` : ""}
      <div class="preview-sum">
        <b>${fmt(Number(d.target) || 0)}</b> ${unit} على
        <b>${open.length}</b> ${SPLITS[d.split].unitLabel} ≈
        <b>${fmt(per)}</b> ${unit} ${SPLITS[d.split].each}
        ${d.rest.length && d.split === "day" ? ` — باستثناء ${d.rest.map(i => DAY_FULL[i]).join(" و")}` : ""}
      </div>
      ${splitAdvice(d, per)}`
    : `<p class="preview-sum">لا توجد وحدات متاحة — راجع أيام الراحة.</p>`}`;
}

/* ينبّه حين يكون التقسيم المختار أدقّ من اللازم أو أخشن من اللازم */
function splitAdvice(d, per) {
  const allowed = PERIODS[d.period].splits;
  const coarser = { day: "week", week: "month" }[d.split];
  const finer   = { week: "day", month: "week" }[d.split];

  if (per > 0 && per < 0.6 && coarser && allowed.includes(coarser)) {
    return `<div class="advice">
      <span>الحصة أقل من وحدة واحدة (${fmt(per)}) — رقم صعب تتابعه.
        الأنسب التقسيم ${SPLITS[coarser].label}.</span>
      <button data-f="split" data-v="${coarser}">حوّلها</button>
    </div>`;
  }
  if (per >= 25 && finer && allowed.includes(finer)) {
    return `<div class="advice">
      <span>الحصة كبيرة (${fmt(per)} ${esc(d.unit || "وحدة")} ${SPLITS[d.split].each}) —
        التقسيم ${SPLITS[finer].label} يعطيك هدفًا يوميًا أوضح.</span>
      <button data-f="split" data-v="${finer}">حوّلها</button>
    </div>`;
  }
  return "";
}

function paintForm() {
  const d = draft;
  const allowed = PERIODS[d.period].splits;
  if (!allowed.includes(d.split)) d.split = allowed[0];

  /* live preview of the division */

  const periodChips = Object.entries(PERIODS).map(([k, v]) =>
    `<button class="chip" data-f="period" data-v="${k}" aria-pressed="${d.period === k}">${v.label}</button>`).join("");
  const splitChips = ["none", "day", "week", "month"].map(k => {
    const on = allowed.includes(k);
    return `<button class="chip" data-f="split" data-v="${k}" aria-pressed="${d.split === k}" ${on ? "" : "disabled"}>${SPLITS[k].label}</button>`;
  }).join("");
  /* شدّة كل يوم: ضغطة تنقلك بين راحة/عادي/مكثّف */
  const dwArr = dayws(d);
  const dayChips = DAY_FULL.map((n, i) => {
    const w = dwArr[i];
    return `<button class="chip sq lv${w}" data-f="dayw" data-v="${i}"
      title="${n} — ${INTENSITY[w][1]}" aria-label="${n}: ${INTENSITY[w][1]}">
      ${DAY_SHORT[i].slice(0, 3)}<em>${w === 0 ? "·" : w === 1 ? "١" : "٢"}</em></button>`;
  }).join("");
  const curveChips = Object.entries(CURVES).map(([k, v]) =>
    `<button class="chip" data-f="curve" data-v="${k}"
       aria-pressed="${(d.curve || "even") === k}" title="${v.hint}">${v.label}</button>`).join("");
  const swatches = COLORS.map(cc =>
    `<button class="sw" style="--s:${cc.v}" data-f="color" data-v="${cc.id}" aria-pressed="${d.color === cc.id}" aria-label="لون ${cc.id}"></button>`).join("");
  const units = UNIT_SUGGEST.map(u => `<option value="${u}"></option>`).join("");

  document.getElementById("modalRoot").innerHTML = `
  <div class="scrim" data-act="scrim">
    <div class="modal" role="dialog" aria-modal="true" aria-label="${d._editing ? "تعديل مهمة" : "مهمة جديدة"}">
      <div class="modal-head">
        <h3>${d._editing ? "تعديل المهمة" : "مهمة جديدة"}</h3>
        <button class="icon-btn" data-act="closeform" aria-label="إغلاق">${icon("close", 16)}</button>
      </div>
      <div class="modal-body">
        ${readCard(d._read)}
        <div class="field">
          <label for="f-title">اسم المهمة</label>
          <input class="inp" id="f-title" data-f="title" value="${esc(d.title)}" placeholder="مثال: إنهاء محاضرات مادة الإحصاء" autocomplete="off">
        </div>

        <div class="row3">
          <div class="field">
            <label for="f-target">المقدار</label>
            <input class="inp" id="f-target" data-f="target" type="number" min="0" step="0.5" value="${d.target}">
          </div>
          <div class="field">
            <label for="f-unit">الوحدة</label>
            <input class="inp" id="f-unit" data-f="unit" value="${esc(d.unit)}" list="units" autocomplete="off">
            <datalist id="units">${units}</datalist>
          </div>
          <div class="field">
            <label>اللون</label>
            <div class="swatches">${swatches}</div>
          </div>
        </div>

        <div class="field">
          <label>التكرار</label>
          <div class="chips">${periodChips}</div>
        </div>

        <div class="field">
          <label>التقسيم الذكي</label>
          <div class="chips">${splitChips}</div>
          <span class="note">اختر الوحدة الأصغر التي تريد أن يوزع عليها المقدار. التقسيم على الأيام داخل فترة شهرية يعرض مجمعا بالأسابيع تلقائيًا.</span>
        </div>

        ${d.split === "day" ? `
        <div class="field">
          <label>شدّة الأيام <span class="note">(اضغط اليوم لتغيّره: راحة ← عادي ← مكثّف)</span></label>
          <div class="chips">${dayChips}</div>
          <span class="note">اليوم المكثّف يأخذ ضعف نصيب اليوم العادي، ويوم الراحة لا يأخذ شيئًا.</span>
        </div>` : ""}

        <div class="field">
          <label>منحنى التوزيع</label>
          <div class="chips">${curveChips}</div>
          <span class="note">${CURVES[d.curve || "even"].hint}.</span>
        </div>

        <label class="switch">
          <input type="checkbox" data-f="catchup" ${d.catchup !== false ? "checked" : ""}>
          <span class="track"></span>
          <span class="sw-txt">
            <b>ترحيل المتأخر تلقائيًا</b>
            <span>إن فاتك يوم، يُعاد توزيع الباقي على الأيام المتبقية بدل ضياعه.</span>
          </span>
        </label>

        <div class="preview" style="--tc:${colorVar(d.color)}">
          ${previewInner(d)}
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-primary" data-act="saveform">${d._editing ? "حفظ التعديل" : "إضافة المهمة"}</button>
        <button class="btn btn-quiet" data-act="closeform">إلغاء</button>
        ${d._editing ? `<span class="spacer"></span><button class="link-btn danger" data-act="del" data-task="${d.id}">حذف المهمة</button>` : ""}
      </div>
    </div>
  </div>`;
  const ti = document.getElementById("f-title");
  if (ti && !d.title) ti.focus();
}

function saveForm() {
  const d = draft;
  d.title = (d.title || "").trim() || "مهمة بلا عنوان";
  d.unit  = (d.unit  || "").trim() || "وحدة";
  d.target = Math.max(0, Number(d.target) || 0);
  const dw = dayws(d);
  const clean = { id:d.id, title:d.title, unit:d.unit, target:d.target, period:d.period,
                  split:d.split, dayw:dw, rest:dw.map((w,i)=>w===0?i:-1).filter(i=>i>=0),
                  curve:d.curve || "even", catchup:d.catchup, color:d.color,
                  created:d.created, archived:false };
  const i = S.tasks.findIndex(t => t.id === d.id);
  if (i >= 0) S.tasks[i] = clean; else S.tasks.push(clean);
  const editing = d._editing;
  closeForm(); save(); render();
  toast(editing ? "تم حفظ التعديلات" : `تمت إضافة «${clean.title}» ووتم تقسيمها ${SPLITS[clean.split].label}`);
}

      <div class="ins-k" style="margin-bottom:13px">أول أيام الأسبوع</div>
      <div class="chips">${WEEK_STARTS.map(([v, l]) =>
        `<button class="chip" data-act="setWeek" data-v="${v}"
           aria-pressed="${S.settings.weekStart === v}">${l}</button>`).join("")}</div>
      <div class="note" style="margin-top:11px">يحدّد بداية الأسبوع في التوزيع والتقويم.</div>
    </div>

    <div class="card" style="padding:18px 20px">
      <div class="ins-k" style="margin-bottom:6px">بياناتك</div>
      <div class="note" style="margin-bottom:14px">
        ${nTasks} مهمة و${nRefl} تأمل، محفوظة داخل هذا المتصفح فقط ولا تُرسل لأي خادم.
        استخدم التصدير والاستيراد للنقل بين أجهزتك.
      </div>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn btn-quiet" data-act="export">تصدير نسخة احتياطية</button>
        <button class="btn btn-quiet" data-act="import">استيراد ملف</button>
      </div>
    </div>

    <div class="card" style="padding:18px 20px">
      <div class="ins-k" style="margin-bottom:6px">حذف الكل</div>
      <div class="note" style="margin-bottom:14px">يمسح كل المهام والسجلات والتأملات. لا يمكن التراجع.</div>
      <button class="btn btn-danger" data-act="wipe">حذف كل البيانات</button>
    </div>

    <p class="note" style="text-align:center">
      مقياس · يعمل بدون إنترنت · <span class="num">${VERSION_TXT}</span>
    </p>
  </div>`;
}

/* self-contained dialog — sandboxed frames block window.prompt/confirm */
function dialog(o) {
  return new Promise(resolve => {
    const root = document.createElement("div");
    root.className = "scrim";
    root.innerHTML = `
      <div class="modal" style="width:min(430px,100%)" role="dialog" aria-modal="true" aria-label="${esc(o.title)}">
        <div class="modal-head"><h3>${esc(o.title)}</h3></div>
        <div class="modal-body">
          ${o.sub ? `<p style="font-size:13.5px;color:var(--text-2);line-height:1.75">${o.sub}</p>` : ""}
          ${o.numeric === false ? "" : `<div class="field">
            <label for="dlgIn">${esc(o.fieldLabel || "القيمة")}</label>
            <input class="inp" id="dlgIn" type="number" min="0" step="0.5" value="${o.value != null ? o.value : 0}">
          </div>`}
        </div>
        <div class="modal-foot">
          <button class="btn ${o.danger ? "btn-danger" : "btn-primary"}" data-ok>${esc(o.okLabel || "تأكيد")}</button>
          <button class="btn btn-quiet" data-cancel>إلغاء</button>
        </div>
      </div>`;
    document.body.appendChild(root);
    const inp = root.querySelector("#dlgIn");
    const finish = v => { root.remove(); resolve(v); };
    root.querySelector("[data-ok]").onclick = () => finish(inp ? Number(inp.value) : true);
    root.querySelector("[data-cancel]").onclick = () => finish(null);
    root.addEventListener("click", e => { if (e.target === root) finish(null); });
    root.addEventListener("keydown", e => {
      if (e.key === "Escape") { e.stopPropagation(); finish(null); }
      if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); finish(inp ? Number(inp.value) : true); }
    });
    (inp || root.querySelector("[data-ok]")).focus();
    if (inp) inp.select();
  });
}

function toast(msg, actionLabel, fn) {
  const wrap = document.getElementById("toastWrap");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (actionLabel) {
    const b = document.createElement("button");
    b.textContent = actionLabel;
    b.onclick = () => { fn(); el.remove(); };
    el.appendChild(b);
  }
  wrap.appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .3s, transform .3s"; el.style.opacity = "0"; el.style.transform = "translateY(10px)"; }, 3200);
  setTimeout(() => el.remove(), 3600);
}

function applyTheme() {
  const th = S.settings.theme;
  const root = document.documentElement;
  if (th === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", th);
  const dark = th === "dark" || (th === "auto" && matchMedia("(prefers-color-scheme:dark)").matches);
  document.getElementById("btnTheme").innerHTML = icon(dark ? "sun" : "moon", 17);
}

function render() {
  renderNav();
  const meta = NAV.find(x => x.id === view);
  document.getElementById("pageTitle").textContent = meta.title;
  const t = today();
  document.getElementById("pageDate").textContent =
    `${DAY_FULL[t.getDay()]} ${t.getDate()} ${MONTHS[t.getMonth()]} ${t.getFullYear()}`;

  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  const host = document.getElementById("v-" + view);
  host.classList.add("on");
  host.innerHTML = view === "today" ? renderToday()
                 : view === "tasks" ? renderTasks()
                 : view === "cal"   ? renderBoard() + renderCal()
                 : view === "stats" ? renderStats()
                 : renderSettings();
}

/* ============================================================
   11. EVENTS
   ============================================================ */
function stepTask(taskId, dir) {
  const task = S.tasks.find(t => t.id === taskId);
  const c = compute(task);
  if (!c.cur) return toast("لا توجد فترة نشطة لهذه المهمة");
  const unitStep = Number.isInteger(task.target) ? 1 : 0.5;
  logProgress(taskId, c.pk, c.cur.k, dir * unitStep);
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act],[data-f]");
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.task;

  switch (act) {
    case "nav":       view = el.dataset.v; render(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
    case "reflToggle": reflOpen = !reflOpen; render(); break;
    case "bwk": {
      const n = Number(el.dataset.v);
      boardRef = n === 0 ? null : addDays(startOfWeek(boardRef || today()), n * 7);
      render();
      break;
    }
    case "bcell": {
      const task = S.tasks.find(x => x.id === el.dataset.task);
      const d = parseKey(el.dataset.d);
      const c = compute(task, d);
      const slot = c.slots.find(x => x.start <= d && d <= x.end);
      if (!slot || slot.rest) break;
      dialog({
        title: `${esc(task.title)} — ${DAY_FULL[d.getDay()]} ${ltr(d.getDate())} ${MONTHS[d.getMonth()]}`,
        sub: `المطلوب <b class="num">${fmt(slot.todo)}</b> ${esc(task.unit)}`,
        fieldLabel: `كم ${task.unit} أنجزت؟`, value: fmt(slot.done), okLabel: "حفظ"
      }).then(v => {
        if (v === null || Number.isNaN(v)) return;
        setProgress(task.id, c.pk, slot.k, v);
        toast(`تم تسجيل ${fmt(v)} ${task.unit}`);
      });
      break;
    }
    case "setTheme":  S.settings.theme = el.dataset.v; save(); applyTheme(); render(); break;
    case "setWeek":   S.settings.weekStart = Number(el.dataset.v); save(); render(); break;
    case "export":    exportBackup(); break;
    case "import":    document.getElementById("fileInput").click(); break;
    case "wipe":
      dialog({ title:"حذف كل البيانات",
               sub:"سيُمسح كل شيء: المهام والسجلات والتأملات. لا يمكن التراجع.",
               numeric:false, okLabel:"احذف الكل", danger:true })
        .then(ok => {
          if (!ok) return;
          S.tasks = []; S.progress = {}; S.reflect = {};
          save(); render(); toast("مُسحت كل البيانات");
        });
      break;
    case "sec": {
      const k = el.dataset.k;
      collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k);
      render();
      break;
    }
    case "magic": runMagic(); break;
    case "inc":       stepTask(id, +1); break;
    case "dec":       stepTask(id, -1); break;
    case "toggle": {
      const task = S.tasks.find(t => t.id === id);
      const c = compute(task);
      if (!c.cur) break;
      const goal = round2(c.cur.done + c.cur.todo);
      if (c.cur.todo <= 0) setProgress(id, c.pk, c.cur.k, 0);
      else logProgress(id, c.pk, c.cur.k, goal - c.cur.done);
      break;
    }
    case "cell": {
      const task = S.tasks.find(t => t.id === id);
      const c = compute(task);
      const s = c.slots.find(x => x.k === el.dataset.slot);
      if (!s || s.rest) break;
      dialog({
        title: slotLong(s),
        sub: `الخطة الأصلية <b class="num">${fmt(s.plan)}</b> · المطلوب بعد إعادة التوزيع
              <b class="num">${fmt(s.todo)}</b> ${esc(task.unit)}`,
        fieldLabel: `كم ${task.unit} أنجزت؟`,
        value: fmt(s.done), okLabel: "حفظ"
      }).then(v => {
        if (v === null || Number.isNaN(v)) return;
        setProgress(id, c.pk, s.k, v);
        toast(`تم تسجيل ${fmt(v)} ${task.unit} — ${slotLong(s)}`);
      });
      break;
    }
    case "expand": {
      expanded.has(id) ? expanded.delete(id) : expanded.add(id);
      render();
      break;
    }
    case "energy": {
      reflDraft = reflCurrent();
      reflDraft.energy = reflDraft.energy === +el.dataset.v ? 0 : +el.dataset.v;
      render();
      break;
    }
    case "block": {
      reflDraft = reflCurrent();
      const v = el.dataset.v;
      reflDraft.blocks = reflDraft.blocks.includes(v)
        ? reflDraft.blocks.filter(x => x !== v)
        : [...reflDraft.blocks, v];
      render();
      break;
    }
    case "reflSave": {
      const d = reflCurrent();
      if (!d.energy && !d.blocks.length && !d.win.trim() && !d.fix.trim()) {
        toast("سجّل طاقتك على الأقل"); break;
      }
      const f = dayFacts();
      S.reflect[key(today())] = {
        energy: d.energy, blocks: d.blocks,
        win: d.win.trim(), fix: d.fix.trim(),
        score: f.pct, done: f.done, planned: f.planned,
        at: Date.now()
      };
      reflDraft = null;
      reflOpen = false;              /* يُطوى بعد الحفظ ويظهر ملخّصه في العنوان */
      save(); render();
      toast("حُفظ تأمل اليوم");
      break;
    }
    case "reflDel": {
      delete S.reflect[key(today())];
      reflDraft = null;
      save(); render();
      toast("حُذف تأمل اليوم");
      break;
    }
    case "edit":      openForm(id); break;
    case "del": {
      const task = S.tasks.find(t => t.id === id);
      if (!task) break;
      dialog({
        title: "حذف المهمة",
        sub: `سيتم حذف «${esc(task.title)}» وكل سجل تقدمه. لا يمكن التراجع عن هذا الإجراء.`,
        numeric: false, okLabel: "حذف نهائيًا", danger: true
      }).then(ok => {
        if (!ok) return;
        S.tasks = S.tasks.filter(t => t.id !== id);
        delete S.progress[id];
        closeForm(); save(); render(); toast("تم حذف المهمة");
      });
      break;
    }
    case "day":       calSel = parseKey(el.dataset.d); render(); break;
    case "calprev":   calRef = new Date(calRef.getFullYear(), calRef.getMonth() - 1, 1); render(); break;
    case "calnext":   calRef = new Date(calRef.getFullYear(), calRef.getMonth() + 1, 1); render(); break;
    case "caltoday":  calRef = new Date(); calSel = today(); render(); break;
    case "closeform": closeForm(); break;
    case "saveform":  saveForm(); break;
    case "scrim":     if (e.target === el) closeForm(); break;
  }

  /* أزرار الاختيار في النموذج فقط.
     الحقول النصية تحمل data-f أيضًا، ولو أعدنا الرسم عند لمسها
     لاختفى الحقل تحت الإصبع وأُغلقت لوحة المفاتيح. */
  const f = el.dataset.f, v = el.dataset.v;
  if (!draft || v == null) return;
  if (f === "period") { draft.period = v; draft.split = bestSplit(v); }
  else if (f === "split") draft.split = v;
  else if (f === "color") draft.color = v;
  else if (f === "curve") draft.curve = v;
  else if (f === "dayw") {
    const n = Number(v), arr = dayws(draft).slice();
    arr[n] = (arr[n] + 1) % 3;                       // راحة ← عادي ← مكثّف
    draft.dayw = arr;
    draft.rest = arr.map((w, i) => (w === 0 ? i : -1)).filter(i => i >= 0);
  } else return;
  paintForm();
});

document.addEventListener("input", e => {
  /* نصوص التأمل: تُحفظ في المسودة بلا إعادة رسم حتى لا تنقطع الكتابة */
  const r = e.target.dataset && e.target.dataset.r;
  if (r) { reflDraft = reflCurrent(); reflDraft[r] = e.target.value; return; }

  const f = e.target.dataset && e.target.dataset.f;
  if (!f || !draft) return;
  if (f === "catchup") { draft.catchup = e.target.checked; paintForm(); return; }
  draft[f] = e.target.value;
  if (f === "target" || f === "unit") {
    /* repaint only the preview so typing isn't interrupted */
    const box = document.querySelector(".preview");
    if (box) box.innerHTML = previewInner(draft);
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "magicIn") { e.preventDefault(); runMagic(); return; }
  if (e.key === "Escape" && draft) closeForm();
  if (e.key === "Enter" && draft && e.target.tagName === "INPUT" && e.target.type !== "checkbox") { e.preventDefault(); saveForm(); }
});

document.getElementById("fab").onclick = () => openForm();
document.getElementById("btnTheme").onclick = () => {
  const order = ["auto", "light", "dark"];
  S.settings.theme = order[(order.indexOf(S.settings.theme) + 1) % 3];
  save(); applyTheme();
  toast(S.settings.theme === "auto" ? "المظهر: حسب النظام" : S.settings.theme === "light" ? "المظهر: فاتح" : "المظهر: داكن");
};
function exportBackup() {
  const blob = new Blob([JSON.stringify({ v: 1, ...S }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `miqyas-${key(today())}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("تم تنزيل نسخة احتياطية");
};
document.getElementById("fileInput").onchange = ev => {
  const file = ev.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (!Array.isArray(j.tasks)) throw 0;
      S.tasks = j.tasks; S.progress = j.progress || {};
      S.settings = Object.assign({}, DEFAULTS, j.settings || {});
      save(); applyTheme(); render(); toast(`تم استيراد ${j.tasks.length} مهمة`);
    } catch (err) { toast("تعذرت قراءة الملف — تأكد أنه نسخة مصدَّرة من مقياس"); }
  };
  r.readAsText(file);
  ev.target.value = "";
};
matchMedia("(prefers-color-scheme:dark)").addEventListener("change", applyTheme);

/* ============================================================
   12. BOOT
   ============================================================ */
if (!S.tasks) S.tasks = [];

/* المهام التجريبية القديمة تُحذف مرة واحدة، دون المساس بما أضافه المستخدم */
if (!S.settings.demoCleared) {
  const before = S.tasks.length;
  S.tasks = S.tasks.filter(t => !/^seed\d+$/.test(t.id));
  Object.keys(S.progress).forEach(id => { if (/^seed\d+$/.test(id)) delete S.progress[id]; });
  S.settings.demoCleared = true;
  save();
  if (before !== S.tasks.length) setTimeout(() => toast("حُذفت المهام التجريبية — ابدأ بمهامك"), 400);
}

/* يعمل بدون إنترنت بعد أول فتح */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

applyTheme();
calSel = today();
render();
</script>
